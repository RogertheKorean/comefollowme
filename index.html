 document.addEventListener('click',event=>{const openButton=event.target.closest('[data-prompt-open]');if(openButton){event.preventDefault();if(window.TogetherNavigation?.openPrompt)void window.TogetherNavigation.openPrompt(openButton.dataset.promptOpen);else void open(openButton.dataset.promptOpen);return;}const reply=event.target.closest('[data-prompt-reply-delete]');if(reply){void deleteReply(reply.dataset.promptReplyDelete);return;}const action=event.target.closest('[data-prompt-action]')?.dataset.promptAction;if(!action)return;if(action==='new')showPromptEditor();else if(action==='edit')showPromptEditor(null,P.current);else if(action==='delete')void deletePrompt();else if(action==='share')void sharePrompt();else if(action==='back'){if(window.TogetherNavigation?.openPrompts)window.TogetherNavigation.openPrompts();else showCollection({push:true});}else if(action==='retry')void refresh({render:true});else if(action==='anchor'&&P.current?.anchor)goToAnchor(P.current.anchor);else if(action==='selection')showPromptEditor(selectedAnchor);else if(action==='preview')previewEditor();else if(action==='remove-poster'&&P.editor){const d=P.editor;if(d.previewUrl)URL.revokeObjectURL(d.previewUrl);d.previewUrl=null;d.posterFile=null;d.removePoster=true;void discardUploadedPoster(d);refreshEditorPoster();}else if(action==='reference'){let a=null;try{a=typeof referenceAnchorFromSelection==='function'?referenceAnchorFromSelection():null;}catch{};try{if(!a&&typeof referenceAnchor==='function'&&typeof reference!=='undefined'&&reference.selected?.length)a=referenceAnchor(reference.selected,'selection');}catch{}showPromptEditor(a);}});
 document.addEventListener('submit',event=>{if(event.target.id==='promptReplyForm')void sendReply(event);if(event.target.id==='promptEditorForm')void savePrompt(event);});
 document.addEventListener('input',event=>{if(event.target.id==='promptReplyBody'||event.target.id==='promptReplyName'){P.replyDraft={name:clip(editorValue('promptReplyName'),LIMITS.author),body:clip(editorValue('promptReplyBody'),LIMITS.reply),nameEdited:P.replyDraft.nameEdited||event.target.id==='promptReplyName'};P.replyError='';P.replyRevision++;const count=$('#promptReplyCount');if(count)count.textContent=`${P.replyDraft.body.length} / ${LIMITS.reply}`;const err=$('#promptReplyError');if(err){err.textContent='';err.hidden=true;}scheduleReplyDraft();}});
 document.addEventListener('change',event=>{if(event.target.id==='promptLessonPicker'&&P.editor){const previous=editorValue('promptLesson'),next=event.target.value,lesson=promptLesson(next);P.editor.lessonKey=next;$('#promptLesson').value=next;$('#promptSource').value=sourceForLesson(lesson);const anchor=$('#promptAnchor');if(anchor?.value)try{if(JSON.parse(anchor.value).lessonKey!==next)anchor.value='';}catch{anchor.value='';}if(previous!==next){const preview=$('#promptEditorPreview');if(preview)preview.hidden=true;}return;}if(event.target.id==='promptPoster'&&P.editor){const file=event.target.files?.[0];if(!file)return;if(!POSTER_TYPES.has(file.type)||file.size>LIMITS.poster){editorError(T('5 MB 이하 PNG·JPG·WebP 이미지를 선택해 주세요.','Choose a PNG, JPG or WebP image up to 5 MB.'));event.target.value='';return;}const d=P.editor;if(d.previewUrl)URL.revokeObjectURL(d.previewUrl);void discardUploadedPoster(d);d.posterFile=file;d.previewUrl=URL.createObjectURL(file);d.removePoster=false;d.uploadPath=null;d.uploadComplete=false;d.uploadAttached=false;refreshEditorPoster();const preview=$('#promptEditorPreview');if(preview)preview.hidden=true;}});
 document.addEventListener('together:lessons',refreshLessonPicker);
 document.addEventListener('together:participant-name',updateReplyName);
 document.addEventListener('together:draft-status',event=>{const detail=event.detail||{};if(detail.kind===DRAFT_KIND&&detail.target===replyTarget())draftStatus(detail.status,detail.target);});
 window.addEventListener('pagehide',()=>{if(P.replyDraft.name||P.replyDraft.body)void flushReplyDraft();if(P.editor)void discardUploadedPoster(P.editor);revokePosters();});
 let promptIdentity=window.TogetherCloud?.user?.id||null;
 document.addEventListener('together:before-identity',()=>{if(P.editor){void discardUploadedPoster(P.editor);if(P.editor.previewUrl)URL.revokeObjectURL(P.editor.previewUrl);P.editor=null;}revokePosters();});
 document.addEventListener('click',event=>{if(event.target.closest('[data-action="modal-close"]')&&modalKind==='prompt-editor'&&P.editor){const d=P.editor;if(d.busy){event.preventDefault();event.stopImmediatePropagation();return;}P.editor=null;if(d.previewUrl)URL.revokeObjectURL(d.previewUrl);void discardUploadedPoster(d);}},true);
 document.addEventListener('cancel',event=>{if(event.target.id==='modal'&&modalKind==='prompt-editor'&&P.editor?.busy){event.preventDefault();event.stopImmediatePropagation();}},true);
 window.TogetherCloud?.client?.auth.onAuthStateChange((_event,session)=>{const next=session?.user?.id||null,adoptingGuest=!promptIdentity&&!!session?.user?.is_anonymous;if(next!==promptIdentity&&!adoptingGuest){P.routeGeneration++;P.loading=false;P.replyLoading=false;P.replySubmission=null;P.retryReply=null;P.replyDraft={name:'',body:'',nameEdited:false};P.replyDraftStatus='';P.replyError='';P.replyRevision++;savedReplyDrafts.clear();if(P.editor?.previewUrl)URL.revokeObjectURL(P.editor.previewUrl);P.editor=null;revokePosters();if(modalKind==='prompt-editor')closeModal(false);if(state.view==='prompts'){rerender(true);setTimeout(async()=>{if(state.view!=='prompts')return;await refresh({render:true});const target=replyTarget();if(target)void restoreReplyDraft(target,P.routeGeneration);},0);}}promptIdentity=next;});
 document.addEventListener('together:access',()=>{if(modalKind==='prompt-editor'&&!canAuthor()){const d=P.editor;P.editor=null;if(d?.previewUrl)URL.revokeObjectURL(d.previewUrl);if(d)void discardUploadedPoster(d);closeModal(false);toast(T('질문을 수정할 권한이 변경되었습니다.','Your permission to edit questions has changed.'),true);}});
 api.ready=refresh({render:false});
})();

/* Question-response threads reuse the insight controls, comment rows and reaction writer. */
'use strict';
(()=>{
 const ui=window.TogetherDiscussion,cloud=window.TogetherCloud,kind='prompt-reply-comment';
 const reactions='together_prompt_reply_reactions',comments='together_prompt_reply_comments';
 const locks=new Set(),pendingComments=new Set(),retries=new Map();let thread=null;
 const T=(ko,en)=>tr(ko,en),client=()=>cloud?.client;
 const reply=id=>window.TogetherPrompts?.getState().replies.find(row=>row.id===id);
 const current=t=>!!t&&thread===t&&modalKind==='prompt-thread'&&modalSession===t.session;
 const date=value=>{try{return new Intl.DateTimeFormat(lang()==='ko'?'ko-KR':'en-US',{dateStyle:'medium'}).format(new Date(value));}catch{return '';}};
 function status(value){const el=$('#discussionDraftStatus');if(el)el.textContent=value==='saved'?T('이 기기에 임시 저장됨 · 등록 전에는 공개되지 않아요.','Draft saved on this device · private until you post.'):value==='error'?T('임시 저장하지 못했습니다. 화면을 닫기 전에 내용을 복사해 주세요.','Could not save the draft. Copy your text before closing.'):value==='saving'?T('입력 중…','Typing…'):T('작성 중인 댓글은 이 기기에 자동으로 임시 저장됩니다.','Your unfinished comment is saved on this device.');}
 function error(t,message){if(!current(t))return;const el=$('#discussionError');if(el){el.hidden=false;el.textContent=message||T('연결을 확인하고 다시 시도해 주세요. 입력한 내용은 남아 있습니다.','Check your connection and try again. Your input has been kept.');}}
 function patch(id,values){window.TogetherPrompts?.updateDiscussion?.(id,values);}
 function rows(t){const el=$('#discussionComments');if(!current(t)||!el)return;el.innerHTML=`<div class="section-row"><h2>${T('댓글','Replies')} ${t.comments.length}</h2></div>`+ui.commentsHTML(t.comments,{name:c=>c.author,stamp:c=>date(c.created_at),canDelete:c=>c.owner_id===cloud.user?.id})+(t.comments.length?'':`<p class="help">${T('첫 댓글을 남겨 보세요.','Start the conversation.')}</p>`);}
 function saveDraft(t){if(!current(t))return;t.draft={name:$('#discussionName').value,body:$('#discussionBody').value,nameEdited:t.draft.nameEdited};t.revision++;window.TogetherDrafts?.save(kind,t.id,t.draft);}
 async function load(t){const revision=++t.loadRevision;try{const data=[];for(let offset=0;;offset+=200){const result=await client().from(comments).select('id,reply_id,owner_id,author,body,created_at').eq('reply_id',t.id).order('created_at').order('id').range(offset,offset+199);if(result.error)throw result.error;data.push(...result.data);if(result.data.length<200)break;}if(!current(t)||revision!==t.loadRevision)return;t.comments=data;t.loaded=true;rows(t);patch(t.id,{discussionComments:data.length});}catch{if(current(t)&&revision===t.loadRevision){const el=$('#discussionComments');el.innerHTML=`<p class="alert error">${T('댓글을 불러오지 못했습니다.','Could not load comments.')}</p><button type="button" class="btn" data-discussion-reload>${T('다시 시도','Retry')}</button>`;}}}
 function open(id){const row=reply(id);if(!row||!client())return;
  const saved=window.TogetherDrafts?.read(kind,id),edited=saved?.nameEdited===true||(saved?.nameEdited===undefined&&!!saved?.name);
  const draft={body:saved?.body||'',name:edited?saved.name:(cloud.participantName?.()||''),nameEdited:edited};
  const t={id,comments:[],loaded:false,loadRevision:0,revision:0,draft,busy:false,session:0};thread=t;
  t.session=showModal(modalHead(T('함께 나누는 생각','A shared conversation'),T('이 답변을 읽고 생각을 이어 나누세요.','Continue the conversation around this response.'))+`<div class="modal-body"><article class="prompt-reply discussion-context"><strong>${esc(row.author)}</strong><p>${esc(row.body)}</p><div class="note-actions" data-discussion-controls="${esc(id)}">${ui.actionsHTML({id,target:'prompt',liked:row.discussionLiked,likes:row.discussionLikes,comments:row.discussionComments})}</div></article><div id="discussionComments" aria-live="polite"><p>${T('댓글을 불러오는 중…','Loading comments…')}</p></div><form id="discussionForm"><label class="participant-name">${T('이름 또는 별명 (선택)','Name or nickname (optional)')}<input id="discussionName" autocomplete="nickname" maxlength="50" value="${esc(draft.name)}" placeholder="${T('익명','Anonymous')}"></label><label for="discussionBody" class="composer-prompt">${T('댓글 남기기','Add a reply')}</label><div class="reply-input"><textarea id="discussionBody" required maxlength="1500" placeholder="${T('생각을 나누거나 질문해 보세요.','Share a thought or ask a question.')}">${esc(draft.body)}</textarea><button class="btn primary" type="submit">${T('등록','Reply')}</button></div><p id="discussionDraftStatus" class="draft-save-status" role="status"></p><div id="discussionError" class="alert error" role="alert" hidden></div></form></div>`,{kind:'prompt-thread',size:'medium'});status(saved?'saved':'idle');$('#discussionForm button[type=submit]').disabled=pendingComments.has(id);void load(t);
 }
 async function heart(id){const row=reply(id);if(!row||locks.has(id))return;locks.add(id);patch(id,{discussionBusy:true});try{const user=await cloud.ensureParticipant();const liked=!!row.discussionLiked;await ui.setReaction({table:reactions,column:'reply_id',id,userId:user.id,liked});if(cloud.user?.id!==user.id)return;patch(id,{discussionLiked:!liked,discussionLikes:Math.max(0,(row.discussionLikes||0)+(liked?-1:1))});}catch{toast(T('공감을 저장하지 못했습니다. 다시 시도해 주세요.','Could not save your reaction. Try again.'),true);}finally{locks.delete(id);patch(id,{discussionBusy:false});}}
 async function send(event){event.preventDefault();const t=thread;if(!t||!current(t)||t.busy||pendingComments.has(t.id))return;const body=$('#discussionBody').value.trim(),name=$('#discussionName').value.trim();if(!body)return;
  const revision=t.revision,old=retries.get(t.id),attempt=old?.body===body&&old.name===name?old:{id:crypto.randomUUID(),body,name};retries.set(t.id,attempt);pendingComments.add(t.id);t.busy=true;$('#discussionForm button[type=submit]').disabled=true;$('#discussionError').hidden=true;
  try{const user=await cloud.ensureParticipant(name);if(!current(t))return;const authRevision=cloud.revision;
   let result=await client().from(comments).insert({id:attempt.id,reply_id:t.id,owner_id:user.id,author:name||T('익명','Anonymous'),body}).select('id,reply_id,owner_id,author,body,created_at').single();
   if(result.error?.code==='23505'){result=await client().from(comments).select('id,reply_id,owner_id,author,body,created_at').eq('id',attempt.id).eq('reply_id',t.id).eq('owner_id',user.id).single();if(!result.error&&(result.data.body!==body||result.data.author!==(name||T('익명','Anonymous'))))throw Error('Comment identity conflict');}
   if(result.error)throw result.error;if(authRevision!==cloud.revision)return;
   // Never erase text written after submission or a draft belonging to another account.
   if(current(t)&&t.revision===revision){if(retries.get(t.id)===attempt)retries.delete(t.id);window.TogetherDrafts?.clear(kind,t.id);t.draft={name:cloud.participantName?.()||'',body:'',nameEdited:false};$('#discussionBody').value='';$('#discussionName').value=t.draft.name;status('idle');}
   if(current(t)){t.loadRevision++;if(!t.comments.some(c=>c.id===result.data.id))t.comments.push(result.data);rows(t);patch(t.id,{discussionComments:t.comments.length});void load(t);}else if(thread?.id===t.id&&current(thread)){void load(thread);}else{const count=await client().from(comments).select('id',{count:'exact',head:true}).eq('reply_id',t.id);if(!count.error&&authRevision===cloud.revision)patch(t.id,{discussionComments:count.count});}
   toast(T('댓글을 저장했습니다.','Reply saved.'));
  }catch{error(t);}finally{t.busy=false;pendingComments.delete(t.id);if(thread?.id===t.id&&current(thread))$('#discussionForm button[type=submit]').disabled=false;}
 }
 async function remove(id){const t=thread,row=t?.comments.find(c=>c.id===id);if(!current(t)||t.busy||row?.owner_id!==cloud.user?.id||!confirm(T('이 댓글을 삭제할까요?','Delete this comment?')))return;t.busy=true;try{const result=await client().from(comments).delete().eq('id',id).eq('owner_id',row.owner_id).select('id');if(result.error||!result.data?.length)throw result.error||Error('Not deleted');if(current(t)){t.loadRevision++;t.comments=t.comments.filter(c=>c.id!==id);rows(t);patch(t.id,{discussionComments:t.comments.length});}}catch{error(t);}finally{t.busy=false;}}
 document.addEventListener('click',event=>{const el=event.target.closest('[data-discussion-action]');if(el){if(el.dataset.discussionAction==='heart')void heart(el.dataset.discussionId);else if(!(modalKind==='prompt-thread'&&thread?.id===el.dataset.discussionId))open(el.dataset.discussionId);return;}const del=event.target.closest('[data-discussion-delete]');if(del)void remove(del.dataset.discussionDelete);if(event.target.closest('[data-discussion-reload]')&&thread)void load(thread);});
 document.addEventListener('submit',event=>{if(event.target.id==='discussionForm')void send(event);});
 document.addEventListener('input',event=>{if(!thread||!current(thread)||!['discussionName','discussionBody'].includes(event.target.id))return;if(event.target.id==='discussionName')thread.draft.nameEdited=true;saveDraft(thread);});
 document.addEventListener('together:draft-status',event=>{if(thread&&current(thread)&&event.detail.kind===kind&&event.detail.target===thread.id)status(event.detail.status);});
 document.addEventListener('together:participant-name',()=>{if(thread&&current(thread)&&!thread.draft.nameEdited){thread.draft.name=cloud.participantName?.()||'';$('#discussionName').value=thread.draft.name;}});
 document.addEventListener('together:before-identity',event=>{if(!event.detail.adoptingGuest){if(thread&&current(thread))closeModal(false);thread=null;retries.clear();}});
 // Background navigation must not leave a conversation attached to a different question.
 ui.closePromptThread=()=>{if(thread&&current(thread))closeModal(false);thread=null;};
 ui.openPromptThread=open;
})();
</script>
<script>/* Public ward calendar. Database policies enforce organization-scoped editing. */
'use strict';
(()=>{
 const M=window.TogetherCalendarModel,BUCKET='together-event-posters';
 const today=M.dayKey(new Date()),C={items:[],current:null,slug:null,loading:false,error:'',missing:false,year:Number(today.slice(0,4)),month:Number(today.slice(5,7))-1,day:Number(today.slice(-2)),layout:innerWidth<=760?'list':'month',organizations:[],includeAll:true,query:'',generation:0,editor:null,busy:false};
 const posters=new Map();let identity=window.TogetherCloud?.user?.id||null;
 const api=window.TogetherCalendar={html,refresh,open,showCollection,showEditor,afterRender,suspend,getState:()=>C};
 const client=()=>window.TogetherCloud?.client;
 const me=()=>window.TogetherCloud?.user;
 const canEdit=row=>window.TogetherAccess?.canManageEvent?.(row)===true;
 const canCreate=()=>window.TogetherAccess?.can?.('events')===true;
 const label=id=>{const org=M.ORGANIZATIONS.find(x=>x[0]===id);return org?org[lang()==='ko'?1:2]:id;};
 const button=(action,text,primary=false,extraClass='')=>`<button type="button" class="btn${primary?' primary':''}${extraClass?' '+extraClass:''}" data-calendar-action="${action}">${text}</button>`;
 const dayString=day=>`${C.year}-${String(C.month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
 const dateLabel=value=>new Intl.DateTimeFormat(lang()==='ko'?'ko-KR':'en-US',{timeZone:M.ZONE,month:'long',day:'numeric',weekday:'short'}).format(new Date(value));
 const statusName=status=>({draft:E('임시 저장','Draft'),published:E('게시됨','Published'),cancelled:E('취소됨','Cancelled')})[status]||'';
 const visible=row=>row&&M.canView(row,canEdit(row));
 const tags=row=>row.organizations.map(o=>`<span class="calendar-tag org-${esc(o)}">${esc(label(o))}</span>`).join('');
 const message=error=>error?.code==='42501'?E('이 조직의 일정을 관리할 권한이 없습니다.','You do not have permission to manage this organization’s events.'):error?.message==='conflict'?E('다른 담당자가 이 일정을 변경했습니다. 입력 내용은 유지했습니다. 목록에서 최신 내용을 확인한 뒤 다시 수정해 주세요.','Another editor changed this event. Your input is kept. Review the latest event before editing again.'):E('연결을 확인하고 다시 시도해 주세요. 입력한 내용은 그대로 남아 있습니다.','Check your connection and try again. Your input has been kept.');
 try{const pref=JSON.parse(localStorage.getItem('together-calendar-preferences')||'{}');C.organizations=Array.isArray(pref.organizations)?pref.organizations.filter(x=>M.ORGANIZATIONS.some(o=>o[0]===x)):[];C.includeAll=pref.includeAll!==false;if(['month','list'].includes(pref.layout))C.layout=pref.layout;}catch{}
 function preferences(){try{localStorage.setItem('together-calendar-preferences',JSON.stringify({organizations:C.organizations,includeAll:C.includeAll,layout:C.layout}));}catch{}}
 function filtered(){return M.filterEvents(C.items.filter(visible),C);}
 function html(){
  if(C.slug)return C.loading?loading():C.current&&visible(C.current)?detail(C.current):emptyState(C.error||E('일정을 찾을 수 없거나 공개되지 않았습니다.','This event is unavailable or has not been published.'),true);
  const rows=filtered();
  return `<main class="workspace calendar-workspace"><div class="page-intro calendar-intro"><div><div class="eyebrow">OUR WARD · TOGETHER</div><h1>${E('우리 와드, 한눈에.','Our ward, at a glance.')}</h1><p>${E('다가오는 만남을 확인하고 함께 준비해요.','See what is coming up and prepare together.')}</p></div>${canCreate()?button('new',icon('plus')+E('일정 등록','New event'),true):''}</div>${filtersHTML()}<div class="calendar-toolbar"><div class="calendar-month"><button class="calendar-icon-button" data-calendar-action="previous" aria-label="${E('이전 달','Previous month')}">${icon('back')}</button><h2>${C.year}${E('년 ', ' / ')}${C.month+1}${E('월','')}</h2><button class="calendar-icon-button" data-calendar-action="next" aria-label="${E('다음 달','Next month')}">${icon('arrow')}</button>${button('today',E('오늘','Today'))}</div><div class="calendar-view-toggle"><button data-calendar-layout="month" aria-pressed="${C.layout==='month'}">${E('달력','Month')}</button><button data-calendar-layout="list" aria-pressed="${C.layout==='list'}">${E('목록','List')}</button></div></div><p class="calendar-summary">${E('한국 시간 (UTC+9)','Korea time (UTC+9)')} · ${rows.length}${E('개의 일정',' events')}${canCreate()?' · '+E('임시 저장은 담당자에게만 표시','Drafts are visible only to assigned editors'):''}</p>${C.loading?loadingContent():C.error?errorContent(C.error):C.layout==='month'?monthHTML(rows):rows.length?`<div class="calendar-list">${rows.map(eventRow).join('')}</div>`:emptyContent()}</main>`;
 }
 function filtersHTML(){return `<section class="calendar-filters" aria-label="${E('일정 필터','Event filters')}"><div class="calendar-filter-chips"><span>${E('조직별로 보기','Organizations')}</span><button class="calendar-chip" data-calendar-org="all-organizations" aria-pressed="${!C.organizations.length}">${E('전체','All')}</button>${M.ORGANIZATIONS.map(([id])=>`<button class="calendar-chip" data-calendar-org="${id}" aria-pressed="${C.organizations.includes(id)}"><span class="calendar-dot org-${id}"></span>${esc(label(id))}</button>`).join('')}</div><div class="calendar-filter-extra"><label class="calendar-check"><input id="calendarIncludeAll" type="checkbox" ${C.includeAll?'checked':''}>${E('전 회원 일정 함께 보기','Include all-member events')}</label><label class="calendar-search">${icon('search','small')}<input id="calendarSearch" type="search" value="${esc(C.query)}" placeholder="${E('제목 또는 장소 검색','Search title or location')}" aria-label="${E('일정 검색','Search events')}"></label></div></section>`;}
 function eventRow(row){const date=M.dayKey(row.starts_at);return `<button class="calendar-event-row" data-event-open="${esc(row.slug)}"><span class="calendar-date-tile"><strong>${Number(date.slice(-2))}</strong><small>${new Intl.DateTimeFormat(lang()==='ko'?'ko-KR':'en',{timeZone:M.ZONE,weekday:'short'}).format(new Date(row.starts_at))}</small></span><span class="calendar-event-summary"><span>${tags(row)}${row.status!=='published'?`<span class="calendar-status ${row.status}">${statusName(row.status)}</span>`:''}</span><strong class="${row.status==='cancelled'?'is-cancelled':''}">${esc(row.title)}</strong><small>${esc(timeRange(row))} · ${esc(row.location)}</small></span>${icon('arrow','small')}</button>`;}
 function timeRange(row){const start=M.dayKey(row.starts_at),end=M.dayKey(row.ends_at);return `${M.timeKey(row.starts_at)} – ${start===end?'':end+' '}${M.timeKey(row.ends_at)}`;}

 });
 document.addEventListener('change',event=>{if(event.target.id==='calendarIncludeAll'){C.includeAll=event.target.checked;preferences();render();return;}if(event.target.closest('#eventEditorForm'))capture();if(event.target.id==='eventPoster'&&C.editor){const file=event.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){editorError(E('5 MB 이하 PNG·JPG·WebP 이미지를 선택해 주세요.','Choose a PNG, JPG or WebP image up to 5 MB.'));event.target.value='';return;}const d=C.editor;if(d.previewUrl)URL.revokeObjectURL(d.previewUrl);d.posterFile=file;d.previewUrl=URL.createObjectURL(file);d.removePoster=false;d.uploadPath=null;d.uploadComplete=false;d.error='';editorHTML();}});
 document.addEventListener('input',event=>{if(event.target.id==='calendarSearch'){C.query=event.target.value;const position=event.target.selectionStart;render();const input=$('#calendarSearch');input?.focus({preventScroll:true});if(input?.type!=='search')input?.setSelectionRange(position,position);}else if(event.target.closest('#eventEditorForm'))capture();});
 document.addEventListener('submit',event=>{if(event.target.id==='eventEditorForm'){event.preventDefault();preview();}});
 document.addEventListener('together:identity',()=>{const next=me()?.id||null;if(next===identity)return;identity=next;suspend();C.items=[];C.current=null;revokePosters();if(C.editor?.previewUrl)URL.revokeObjectURL(C.editor.previewUrl);C.editor=null;if(['event-editor','event-preview'].includes(modalKind))closeModal(false);});
 document.addEventListener('together:access',()=>{C.items=C.items.filter(visible);if(C.current&&!visible(C.current))C.current=null;if(C.editor&&(!canCreate()||C.editor.actor!==me()?.id)){C.editor=null;if(['event-editor','event-preview'].includes(modalKind))closeModal(false);}if(state.view==='calendar')void refresh();});
})();
</script>
<script>/* Shared history and shell navigation for lessons, questions and ward events. */
'use strict';
(()=>{
 ICONS.calendar='M4 5h16v16H4z M4 10h16 M8 3v4 M16 3v4 M8 14h2 M14 14h2 M8 18h2';
 const previousEntries=navEntries,previousNavigate=navigate,previousRender=render,previousAnchor=goToAnchor;
 const supported=new Set(['dashboard','read','community','mine','classroom','import','library']);
 navEntries=function(){const entries=previousEntries();return [entries.find(x=>x[0]==='dashboard'),['calendar','calendar',E('와드 일정','Ward calendar')],['prompts','chat',E('함께 생각하기','Study questions')],...entries.filter(x=>x[0]!=='dashboard')].filter(Boolean);};
 mobileNavHTML=function(){return `<nav class="mobile-bottom" aria-label="${E('빠른 탐색','Quick navigation')}">${[['dashboard','book',E('공과','Lessons')],['calendar','calendar',E('일정','Calendar')],['prompts','chat',E('질문','Questions')],['mine','note',E('내 기록','Journal')]].map(([v,i,label])=>`<button data-nav="${v}" class="${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''}>${icon(i)}<span>${label}</span></button>`).join('')}</nav>`;};
 render=function(...args){
  // Cloud refreshes must preserve a visitor's composing focus and mobile keyboard.
  const menuOpen=$('#sidebar')?.classList.contains('open'),menuScroll=$('#sidebar')?.scrollTop||0;
  const focused=document.activeElement,restore=focused?.id&&focused.closest('#app')&&focused.matches('input,textarea');
  const id=restore?focused.id:null,selection=restore?{start:focused.selectionStart,end:focused.selectionEnd}:null;
  const result=previousRender(...args);
  if(menuOpen){$('#sidebar')?.classList.add('open');$('#menuBackdrop')?.classList.add('active');if($('#sidebar'))$('#sidebar').scrollTop=menuScroll;}
  if(id){const replacement=document.getElementById(id);if(replacement){replacement.focus({preventScroll:true});try{if(selection.start!==null)replacement.setSelectionRange(selection.start,selection.end);}catch{}}}
  if(state.view==='calendar')void window.TogetherCalendar?.afterRender();
  return result;
 };
 function writeURL(path,replace=false){if(location.pathname+location.search+location.hash===path)return;history[replace?'replaceState':'pushState']({togetherView:state.view},'',path);}
 function startView(view){window.TogetherDrafts?.flush();$('#sidebar')?.classList.remove('open');$('#menuBackdrop')?.classList.remove('active');if(state.view!==view){window.TogetherPrompts?.suspend();window.TogetherCalendar?.suspend();}if(typeof closeReference==='function')closeReference();clearSelection();}
 function openPrompts({push=true}={}){startView('prompts');if(push)writeURL('/questions');window.TogetherPrompts.showCollection({push:false});saveState();window.scrollTo(0,0);}
 function openPrompt(slug,{push=true}={}){startView('prompts');if(push)writeURL('/p/'+encodeURIComponent(slug));const pending=window.TogetherPrompts.open(slug,{push:false});saveState();window.scrollTo(0,0);return pending;}
 function openCalendar({push=true}={}){startView('calendar');if(push)writeURL('/calendar');window.TogetherCalendar.showCollection({push:false});saveState();window.scrollTo(0,0);}
 function openEvent(slug,{push=true}={}){startView('calendar');if(push)writeURL('/e/'+encodeURIComponent(slug));const pending=window.TogetherCalendar.open(slug,{push:false});saveState();window.scrollTo(0,0);return pending;}
 navigate=function(view,...args){if(view==='prompts')return openPrompts();if(view==='calendar')return openCalendar();startView(view);const result=previousNavigate(view,...args);if(state.view===view)writeURL(view==='dashboard'?'/':'/?view='+encodeURIComponent(view));return result;};
 goToAnchor=function(anchor,...args){const result=previousAnchor(anchor,...args);if(state.view==='read')writeURL('/?view=read');return result;};
 function fromLocation(){const path=location.pathname.replace(/\/$/,'')||'/';let match;if((match=path.match(/^\/p\/([^/]+)$/)))return openPrompt(match[1],{push:false});if((match=path.match(/^\/e\/([^/]+)$/)))return openEvent(match[1],{push:false});if(path==='/questions')return openPrompts({push:false});if(path==='/calendar')return openCalendar({push:false});const query=new URLSearchParams(location.search),requested=query.get('view'),view=supported.has(requested)?requested:'dashboard';startView(view);previousNavigate(view);}
 async function share(title,path){const value=new URL(path,location.origin).href;try{if(navigator.share){await navigator.share({title,url:value});return;}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);toast(E('공유 주소를 복사했습니다.','Share link copied.'));return;}}catch(error){if(error?.name==='AbortError')return;}showModal(modalHead(E('공유 주소','Share link'),E('아래 주소를 복사해 보내세요.','Copy the address below to share it.'))+`<div class="modal-body"><input id="communityShareURL" style="width:100%;font-size:16px;min-height:46px" readonly value="${esc(value)}" aria-label="${E('공유 주소','Share URL')}"></div>`,{kind:'community-share',size:'medium'});$('#communityShareURL')?.select();}
 window.TogetherNavigation={openPrompts,openPrompt,openCalendar,openEvent,share,navigate:(view)=>navigate(view)};
 window.addEventListener('popstate',()=>{if($('#modal')?.open)closeModal(false);fromLocation();});
 window.addEventListener('online',()=>{if(state.view==='calendar')void window.TogetherCalendar.refresh();if(state.view==='prompts')void window.TogetherPrompts.refresh({render:true});});
 let refreshing=false;
 async function refreshCommunity(){if(refreshing||document.hidden||$('#modal')?.open||window.TogetherPrompts.getState().replySubmitting||window.TogetherCalendar.getState().busy||document.activeElement?.matches('input,textarea,[contenteditable=true]')||!window.getSelection()?.isCollapsed)return;const view=state.view;if(!['prompts','calendar'].includes(view))return;refreshing=true;try{await (view==='prompts'?window.TogetherPrompts:window.TogetherCalendar).refresh({render:false});if(state.view===view)refreshPreservingScroll();}finally{refreshing=false;}}
 setInterval(()=>void refreshCommunity(),30000);
 window.addEventListener('focus',()=>void refreshCommunity());
 // Do not rewrite auth callback search/hash tokens during the first render.
 fromLocation();
})();
</script>
<script>/* VisualViewport follows the keyboard on Safari and Chrome without disabling pinch zoom. */
(()=>{
 const viewport=window.visualViewport,root=document.documentElement;
 let frame=0;
 function update(){
  frame=0;
  if(viewport&&Math.abs(viewport.scale-1)>0.05)return;
  const height=viewport?.height||innerHeight,top=viewport?.offsetTop||0;
  root.style.setProperty('--visual-height',Math.round(height)+'px');
  root.style.setProperty('--visual-top',Math.round(top)+'px');
  const editing=document.activeElement?.matches('input:not([type=checkbox]):not([type=radio]),textarea,[contenteditable=true]');
  document.body.classList.toggle('keyboard-open',!!editing&&innerHeight-height>140);
 }
 function schedule(){if(!frame)frame=requestAnimationFrame(update);}
 viewport?.addEventListener('resize',schedule,{passive:true});
 viewport?.addEventListener('scroll',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 document.addEventListener('focusin',schedule);
 document.addEventListener('focusout',schedule);
 update();
})();
</script>
