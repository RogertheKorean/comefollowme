il."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-aada7ef89a","source":{"ko":"https://www.bible.com/ko/bible/88/PRO.4.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/prov/4?lang=eng"}},"ot/prov/15":{"key":"ot/prov/15","book":{"ko":"잠언","en":"Proverbs"},"chapter":15,"verses":{"ko":{"1":"유순한 대답은 분노를 쉬게 하여도 과격한 말은 노를 격동하느니라","2":"지혜 있는 자의 혀는 지식을 선히 베풀고 미련한 자의 입은 미련한 것을 쏟느니라","3":"여호와의 눈은 어디서든지 악인과 선인을 감찰하시느니라","4":"온량한 혀는 곧 생명 나무라도 패려한 혀는 마음을 상하게 하느니라","18":"분을 쉽게 내는 자는 다툼을 일으켜도 노하기를 더디 하는 자는 시비를 그치게 하느니라","33":"여호와를 경외하는 것은 지혜의 훈계라 겸손은 존귀의 앞잡이니라"},"en":{"1":"A soft answer turneth away wrath: but grievous words stir up anger.","2":"The tongue of the wise useth knowledge aright: but the mouth of fools poureth out foolishness.","3":"The eyes of the Lord are in every place, beholding the evil and the good.","4":"A wholesome tongue is a tree of life: but perverseness therein is a breach in the spirit.","18":"A wrathful man stirreth up strife: but he that is slow to anger appeaseth strife.","33":"The fear of the Lord is the instruction of wisdom; and before honour is humility."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-78c539823c","source":{"ko":"https://www.bible.com/ko/bible/88/PRO.15.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/prov/15?lang=eng"}},"ot/prov/16":{"key":"ot/prov/16","book":{"ko":"잠언","en":"Proverbs"},"chapter":16,"verses":{"ko":{"6":"인자와 진리로 인하여 죄악이 속하게 되고 여호와를 경외함으로 인하여 악에서 떠나게 되느니라","9":"사람이 마음으로 자기의 길을 계획할지라도 그 걸음을 인도하는 자는 여호와시니라","24":"선한 말은 꿀송이 같아서 마음에 달고 뼈에 양약이 되느니라","25":"어떤 길은 사람의 보기에 바르나 필경은 사망의 길이니라","26":"노력하는 자는 식욕을 인하여 애쓰나니 이는 그 입이 자기를 독촉함이니라","27":"불량한 자는 악을 꾀하나니 그 입술에는 맹렬한 불 같은 것이 있느니라","28":"패려한 자는 다툼을 일으키고 말장이는 친한 벗을 이간하느니라","29":"강포한 사람은 그 이웃을 꾀어 불선한 길로 인도하느니라","30":"눈을 감는 자는 패역한 일을 도모하며 입술을 닫는 자는 악한 일을 이루느니라","31":"백발은 영화의 면류관이라 의로운 길에서 얻으리라","32":"노하기를 더디하는 자는 용사보다 낫고 자기의 마음을 다스리는 자는 성을 빼앗는 자보다 나으니라"},"en":{"6":"By mercy and truth iniquity is purged: and by the fear of the Lord men depart from evil.","9":"A man's heart deviseth his way: but the Lord directeth his steps.","24":"Pleasant words are as an honeycomb, sweet to the soul, and health to the bones.","25":"There is a way that seemeth right unto a man, but the end thereof are the ways of death.","26":"He that laboureth laboureth for himself; for his mouth craveth it of him.","27":"An ungodly man diggeth up evil: and in his lips there is as a burning fire.","28":"A froward man soweth strife: and a whisperer separateth chief friends.","29":"A violent man enticeth his neighbour, and leadeth him into the way that is not good.","30":"He shutteth his eyes to devise froward things: moving his lips he bringeth evil to pass.","31":"The hoary head is a crown of glory, if it be found in the way of righteousness.","32":"He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-019d54d272","source":{"ko":"https://www.bible.com/ko/bible/88/PRO.16.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng"}},"ot/eccl/12":{"key":"ot/eccl/12","book":{"ko":"전도서","en":"Ecclesiastes"},"chapter":12,"verses":{"ko":{"1":"너는 청년의 때 곧 곤고한 날이 이르기 전, 나는 아무 낙이 없다고 할 해가 가깝기 전에 너의 창조자를 기억하라","7":"흙은 여전히 땅으로 돌아가고 신은 그 주신 하나님께로 돌아가기 전에 기억하라","13":"일의 결국을 다 들었으니 하나님을 경외하고 그 명령을 지킬찌어다 이것이 사람의 본분이니라","14":"하나님은 모든 행위와 모든 은밀한 일을 선악간에 심판하시리라"},"en":{"1":"Remember now thy Creator in the days of thy youth, while the evil days come not, nor the years draw nigh, when thou shalt say, I have no pleasure in them;","7":"Then shall the dust return to the earth as it was: and the spirit shall return unto God who gave it.","13":"Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man.","14":"For God shall bring every work into judgment, with every secret thing, whether it be good, or whether it be evil."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-2bb0315f46","source":{"ko":"https://www.bible.com/ko/bible/88/ECC.12.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=eng"}},"ot/prov/8":{"key":"ot/prov/8","book":{"ko":"잠언","en":"Proverbs"},"chapter":8,"verses":{"ko":{"13":"여호와를 경외하는 것은 악을 미워하는 것이라 나는 교만과 거만과 악한 행실과 패역한 입을 미워하느니라"},"en":{"13":"The fear of the Lord is to hate evil: pride, and arrogancy, and the evil way, and the froward mouth, do I hate."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-7d1abed813","source":{"ko":"https://www.bible.com/ko/bible/88/PRO.8.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/prov/8?lang=eng"}},"ot/prov/31":{"key":"ot/prov/31","book":{"ko":"잠언","en":"Proverbs"},"chapter":31,"verses":{"ko":{"10":"누가 현숙한 여인을 찾아 얻겠느냐 그 값은 진주보다 더 하니라","11":"그런 자의 남편의 마음은 그를 믿나니 산업이 핍절치 아니하겠으며","12":"그런 자는 살아 있는 동안에 그 남편에게 선을 행하고 악을 행치 아니하느니라","13":"그는 양털과 삼을 구하여 부지런히 손으로 일하며","14":"상고의 배와 같아서 먼데서 양식을 가져 오며","15":"밤이 새기 전에 일어나서 그 집 사람에게 식물을 나눠주며 여종에게 일을 정하여 맡기며","16":"밭을 간품하여 사며 그 손으로 번 것을 가지고 포도원을 심으며","17":"힘으로 허리를 묶으며 그 팔을 강하게 하며","18":"자기의 무역하는 것이 이로운 줄을 깨닫고 밤에 등불을 끄지 아니하고","19":"손으로 솜뭉치를 들고 손가락으로 가락을 잡으며","20":"그는 간곤한 자에게 손을 펴며 궁핍한 자를 위하여 손을 내밀며","21":"그 집 사람들은 다 홍색 옷을 입었으므로 눈이 와도 그는 집 사람을 위하여 두려워하지 아니하며","22":"그는 자기를 위하여 아름다운 방석을 지으며 세마포와 자색 옷을 입으며","23":"그 남편은 그 땅의 장로로 더불어 성문에 앉으며 사람의 아는 바가 되며","24":"그는 베로 옷을 지어 팔며 띠를 만들어 상고에게 맡기며","25":"능력과 존귀로 옷을 삼고 후일을 웃으며","26":"입을 열어 지혜를 베풀며 그 혀로 인애의 법을 말하며","27":"그 집안 일을 보살피고 게을리 얻은 양식을 먹지 아니하나니","28":"그 자식들은 일어나 사례하며 그 남편은 칭찬하기를","29":"덕행 있는 여자가 많으나 그대는 여러 여자보다 뛰어난다 하느니라","30":"고운 것도 거짓되고 아름다운 것도 헛되나 오직 여호와를 경외하는 여자는 칭찬을 받을 것이라","31":"그 손의 열매가 그에게로 돌아갈 것이요 그 행한 일을 인하여 성문에서 칭찬을 받으리라"},"en":{"10":"Who can find a virtuous woman? for her price is far above rubies.","11":"The heart of her husband doth safely trust in her, so that he shall have no need of spoil.","12":"She will do him good and not evil all the days of her life.","13":"She seeketh wool, and flax, and worketh willingly with her hands.","14":"She is like the merchants' ships; she bringeth her food from afar.","15":"She riseth also while it is yet night, and giveth meat to her household, and a portion to her maidens.","16":"She considereth a field, and buyeth it: with the fruit of her hands she planteth a vineyard.","17":"She girdeth her loins with strength, and strengtheneth her arms.","18":"She perceiveth that her merchandise is good: her candle goeth not out by night.","19":"She layeth her hands to the spindle, and her hands hold the distaff.","20":"She stretcheth out her hand to the poor; yea, she reacheth forth her hands to the needy.","21":"She is not afraid of the snow for her household: for all her household are clothed with scarlet.","22":"She maketh herself coverings of tapestry; her clothing is silk and purple.","23":"Her husband is known in the gates, when he sitteth among the elders of the land.","24":"She maketh fine linen, and selleth it; and delivereth girdles unto the merchant.","25":"Strength and honour are her clothing; and she shall rejoice in time to come.","26":"She openeth her mouth with wisdom; and in her tongue is the law of kindness.","27":"She looketh well to the ways of her household, and eateth not the bread of idleness.","28":"Her children arise up, and call her blessed; her husband also, and he praiseth her.","29":"Many daughters have done virtuously, but thou excellest them all.","30":"Favour is deceitful, and beauty is vain: but a woman that feareth the Lord, she shall be praised.","31":"Give her of the fruit of her hands; and let her own works praise her in the gates."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-93ffc4155b","source":{"ko":"https://www.bible.com/ko/bible/88/PRO.31.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/prov/31?lang=eng"}},"ot/eccl/1":{"key":"ot/eccl/1","book":{"ko":"전도서","en":"Ecclesiastes"},"chapter":1,"verses":{"ko":{"2":"전도자가 가로되 헛되고 헛되며 헛되고 헛되니 모든 것이 헛되도다","17":"내가 다시 지혜를 알고자 하며 미친 것과 미련한 것을 알고자 하여 마음을 썼으나 이것도 바람을 잡으려는 것인줄을 깨달았도다","18":"지혜가 많으면 번뇌도 많으니 지식을 더하는 자는 근심을 더하느니라"},"en":{"2":"Vanity of vanities, saith the Preacher, vanity of vanities; all is vanity.","17":"And I gave my heart to know wisdom, and to know madness and folly: I perceived that this also is vexation of spirit.","18":"For in much wisdom is much grief: and he that increaseth knowledge increaseth sorrow."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-60375e7698","source":{"ko":"https://www.bible.com/ko/bible/88/ECC.1.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/1?lang=eng"}},"ot/eccl/3":{"key":"ot/eccl/3","book":{"ko":"전도서","en":"Ecclesiastes"},"chapter":3,"verses":{"ko":{"1":"천하에 범사가 기한이 있고 모든 목적이 이룰 때가 있나니","2":"날 때가 있고 죽을 때가 있으며 심을 때가 있고 심은 것을 뽑을 때가 있으며","3":"죽일 때가 있고 치료 시킬 때가 있으며 헐 때가 있고 세울 때가 있으며","4":"울 때가 있고 웃을 때가 있으며 슬퍼할 때가 있고 춤출 때가 있으며","5":"돌을 던져 버릴 때가 있고 돌을 거둘 때가 있으며 안을 때가 있고 안는 일을 멀리 할 때가 있으며","6":"찾을 때가 있고 잃을 때가 있으며 지킬 때가 있고 버릴 때가 있으며","7":"찢을 때가 있고 꿰맬 때가 있으며 잠잠할 때가 있고 말할 때가 있으며","8":"사랑할 때가 있고 미워할 때가 있으며 전쟁할 때가 있고 평화할 때가 있느니라","11":"하나님이 모든 것을 지으시되 때를 따라 아름답게 하셨고 또 사람에게 영원을 사모하는 마음을 주셨느니라 그러나 하나님의 하시는 일의 시종을 사람으로 측량할 수 없게 하셨도다"},"en":{"1":"To every thing there is a season, and a time to every purpose under the heaven:","2":"A time to be born, and a time to die; a time to plant, and a time to pluck up that which is planted;","3":"A time to kill, and a time to heal; a time to break down, and a time to build up;","4":"A time to weep, and a time to laugh; a time to mourn, and a time to dance;","5":"A time to cast away stones, and a time to gather stones together; a time to embrace, and a time to refrain from embracing;","6":"A time to get, and a time to lose; a time to keep, and a time to cast away;","7":"A time to rend, and a time to sew; a time to keep silence, and a time to speak;","8":"A time to love, and a time to hate; a time of war, and a time of peace.","11":"He hath made every thing beautiful in his time: also he hath set the world in their heart, so that no man can find out the work that God maketh from the beginning to the end."}},"coverage":"excerpt","edition":{"ko":"개역한글 · 대한성서공회 1961","en":"King James Version (KJV)"},"revision":"krv1961-kjv-demo-340329df7e","source":{"ko":"https://www.bible.com/ko/bible/88/ECC.3.KRV","en":"https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/3?lang=eng"}}}}</script>
<script id="reference-data" type="application/json">{"schema":"together-reference-library-v3","documents":[{"key":"/study/general-conference/2015/04/therefore-they-hushed-their-fears","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2015/04/therefore-they-hushed-their-fears","title":"그러므로 그들이 두려움을 가라앉히고","author":"데이비드 에이 베드나 장로","date":"2015 · 04","language":"ko","coverage":"summary","edition":"시연용 학습 요약 · 공식 말씀 전문 아님","provenance":"공식 말씀을 참고해 작성한 짧은 비공식 요약입니다. 원문을 인용한 것이 아니며, 아래 문단 번호는 요약 내부 위치입니다.","blocks":[{"id":"summary-1","markdown":"베드나 장로는 불확실한 상황에서 느끼는 불안과, 주님을 경외하는 마음을 구별합니다. 주님을 경외한다는 것은 그분을 존중하며 뜻에 순종하는 것입니다.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"앨마의 백성은 하나님이 자신들을 구하실 수 있음을 기억하면서 두려움을 가라앉혔습니다. 중요한 변화는 위험만 바라보던 시선을 구주께 돌린 데 있습니다.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"말씀은 그리스도께 초점을 맞추고, 그분 위에 삶의 토대를 놓으며, 믿음으로 계속 나아가도록 권합니다. 성약을 기억하고 지키는 일도 그 토대와 연결됩니다.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"경외와 순종에 관한 [전도서 12:13–14](https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=kor\u0026id=p13-p14#p13)을 함께 읽어 보세요. 이 링크에서도 같은 패널의 성구 읽기를 체험할 수 있습니다.","type":"paragraph","sourceId":false}],"revision":"e65cfbf43ce1aa6b"},{"key":"/study/general-conference/2015/04/therefore-they-hushed-their-fears","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2015/04/therefore-they-hushed-their-fears","title":"Therefore They Hushed Their Fears","author":"Elder David A. Bednar","date":"2015 · 04","language":"en","coverage":"summary","edition":"Demo study summary · not the original talk","provenance":"A brief, independently written summary based on the cited official talk. Paragraph IDs belong to this summary, not to the original talk.","blocks":[{"id":"summary-1","markdown":"Elder Bednar distinguishes anxiety about uncertain circumstances from reverence for the Lord. Reverence includes respect for Christ and willingness to obey Him.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"Alma’s people remembered God’s power to deliver them and quieted their fears. Their attention moved from danger toward the Savior.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"The message encourages attention to Christ, a foundation built on Him, and faithful forward movement. Remembering and keeping covenants contributes to that foundation.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"Read [Ecclesiastes 12:13–14](https://www.churchofjesuschrist.org/study/scriptures/ot/eccl/12?lang=eng\u0026id=p13-p14#p13) on reverence and obedience. This link also demonstrates nested scripture reading in the same panel.","type":"paragraph","sourceId":false}],"revision":"6bbcfc7461f76682"},{"key":"/study/general-conference/2021/10/51gong","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2021/10/51gong","title":"다시 신뢰하십시오","author":"게릿 더블유 공 장로","date":"2021 · 10","language":"ko","coverage":"summary","edition":"시연용 학습 요약 · 공식 말씀 전문 아님","provenance":"공식 말씀을 참고해 작성한 짧은 비공식 요약입니다. 원문을 인용한 것이 아니며, 아래 문단 번호는 요약 내부 위치입니다.","blocks":[{"id":"summary-1","markdown":"공 장로는 상처를 입거나 기대가 이루어지지 않았을 때 하나님과 사람을 신뢰하기 어려울 수 있음을 인정합니다.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"하나님께 돌아오는 여정에서 다시 신뢰를 키울 수 있습니다. 필요한 것은 믿음뿐 아니라 용기, 지혜, 분별력입니다.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"서로를 더 용서하고 덜 판단하는 태도는 교회가 돌아올 수 있는 집처럼 느껴지게 합니다. 신뢰는 사람의 완전함을 가정하는 것과 다릅니다.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"공과와 연결해서 [잠언 3:5–7](https://www.churchofjesuschrist.org/study/scriptures/ot/prov/3?lang=kor\u0026id=p5-p7#p5)을 읽어 보세요. 신뢰를 다시 배우는 데 지금 필요한 작은 행동은 무엇인가요?","type":"paragraph","sourceId":false}],"revision":"add93bcf4d76c463"},{"key":"/study/general-conference/2021/10/51gong","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2021/10/51gong","title":"Trust Again","author":"Elder Gerrit W. Gong","date":"2021 · 10","language":"en","coverage":"summary","edition":"Demo study summary · not the original talk","provenance":"A brief, independently written summary based on the cited official talk. Paragraph IDs belong to this summary, not to the original talk.","blocks":[{"id":"summary-1","markdown":"Elder Gong acknowledges that hurt and unmet expectations can make trusting God and other people difficult.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"Trust can grow again as we return toward God. That process calls for courage, wisdom and discernment alongside faith.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"More forgiveness and less judgment can help the Church feel like a welcoming home. Trust does not require assuming that people are perfect.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"For a connection to this lesson, read [Proverbs 3:5–7](https://www.churchofjesuschrist.org/study/scriptures/ot/prov/3?lang=eng\u0026id=p5-p7#p5). What small action could help you learn to trust again?","type":"paragraph","sourceId":false}],"revision":"8ff05720c52a6254"},{"key":"/study/general-conference/2022/04/15andersen","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2022/04/15andersen","title":"예수님을 따름: 화평하게 하는 자가 됨","author":"닐 엘 앤더슨 장로","date":"2022 · 04","language":"ko","coverage":"summary","edition":"시연용 학습 요약 · 공식 말씀 전문 아님","provenance":"공식 말씀을 참고해 작성한 짧은 비공식 요약입니다. 원문을 인용한 것이 아니며, 아래 문단 번호는 요약 내부 위치입니다.","blocks":[{"id":"summary-1","markdown":"앤더슨 장로는 온라인에서 분노와 경멸이 빠르게 퍼지는 상황 속에서도 그리스도의 제자로 살아가도록 권합니다.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"화평을 만드는 일은 믿는 바를 숨기는 수동적인 태도가 아닙니다. 신앙을 나누면서도 적의와 분노를 내려놓을 수 있습니다.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"다른 관점을 가진 사람에게도 존중과 사랑으로 반응하는 것이 구주를 따르는 실천이 됩니다.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"공과의 [잠언 15:1–4, 18](https://www.churchofjesuschrist.org/study/scriptures/ot/prov/15?lang=kor\u0026id=p1-p4,p18#p1)과 연결해 읽어 보세요. 의견이 다를 때도 관계를 지키는 대답을 어떻게 할 수 있을까요?","type":"paragraph","sourceId":false}],"revision":"589e4389630b4017"},{"key":"/study/general-conference/2022/04/15andersen","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2022/04/15andersen","title":"Following Jesus: Being a Peacemaker","author":"Elder Neil L. Andersen","date":"2022 · 04","language":"en","coverage":"summary","edition":"Demo study summary · not the original talk","provenance":"A brief, independently written summary based on the cited official talk. Paragraph IDs belong to this summary, not to the original talk.","blocks":[{"id":"summary-1","markdown":"Elder Andersen invites disciples to follow Christ even when anger and contempt spread rapidly online.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"Peacemaking does not mean passively hiding conviction. We can share our faith while setting aside hostility and anger.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"Respectful, loving responses to people with different perspectives put discipleship into practice.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"Connect this message with the lesson’s [Proverbs 15:1–4, 18](https://www.churchofjesuschrist.org/study/scriptures/ot/prov/15?lang=eng\u0026id=p1-p4,p18#p1). How could your next reply protect a relationship during disagreement?","type":"paragraph","sourceId":false}],"revision":"940e0f4fb53e7ace"},{"key":"/study/general-conference/2024/04/41rasband","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2024/04/41rasband","title":"말은 중요합니다","author":"로널드 에이 래스번드 장로","date":"2024 · 04","language":"ko","coverage":"summary","edition":"시연용 학습 요약 · 공식 말씀 전문 아님","provenance":"공식 말씀을 참고해 작성한 짧은 비공식 요약입니다. 원문을 인용한 것이 아니며, 아래 문단 번호는 요약 내부 위치입니다.","blocks":[{"id":"summary-1","markdown":"래스번드 장로는 말이 우리의 신념과 마음을 드러내며 주변의 분위기에 영향을 준다고 가르칩니다.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"경솔한 말은 상처를 남길 수 있지만, 사려 깊은 말은 용기와 희망을 전하고 다시 시작하도록 도울 수 있습니다.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"하나님의 말씀을 듣고 따르는 일은 다른 모든 말보다 중요합니다. 말씀을 공부하는 것은 주님께 가까이 나아가는 길입니다.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"공과와 연결해 [잠언 16:24](https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=kor\u0026id=p24#p24)을 읽어 보세요. 오늘 누군가에게 전할 수 있는 진실하고 따뜻한 말은 무엇인가요?","type":"paragraph","sourceId":false}],"revision":"9cf3e1ea3c8a24eb"},{"key":"/study/general-conference/2024/04/41rasband","kind":"conference","url":"https://www.churchofjesuschrist.org/study/general-conference/2024/04/41rasband","title":"Words Matter","author":"Elder Ronald A. Rasband","date":"2024 · 04","language":"en","coverage":"summary","edition":"Demo study summary · not the original talk","provenance":"A brief, independently written summary based on the cited official talk. Paragraph IDs belong to this summary, not to the original talk.","blocks":[{"id":"summary-1","markdown":"Elder Rasband teaches that words reveal beliefs and feelings and influence the atmosphere around us.","type":"paragraph","sourceId":false},{"id":"summary-2","markdown":"Careless speech can wound, while thoughtful words can encourage hope and help people begin again.","type":"paragraph","sourceId":false},{"id":"summary-3","markdown":"Listening to and following God’s word matters above all other speech. Studying His word draws us closer to Him.","type":"paragraph","sourceId":false},{"id":"summary-4","markdown":"Connect this message with [Proverbs 16:24](https://www.churchofjesuschrist.org/study/scriptures/ot/prov/16?lang=eng\u0026id=p24#p24). What sincere, kind words could you offer someone today?","type":"paragraph","sourceId":false}],"revision":"012e73eaee9c32a3"},{"key":"/study/manual/teaching-in-the-saviors-way-2022/07-part-2/11-invite-diligent-learning","kind":"manual","url":"https://www.churchofjesuschrist.org/study/manual/teaching-in-the-saviors-way-2022/07-part-2/11-invite-diligent-learning","title":"구주께서 보여 주신 방법으로 가르침 · 부지런히 배우도록 권유한다","author":"","date":"2022","language":"ko","coverage":"excerpt","edition":"첨부 공과에 인용된 발췌","provenance":"Source: user-provided Pasted markdown.md; excerpt only. The supplied lesson links this quotation to p19. English retains the v2 prototype translation.","blocks":[{"id":"p19","markdown":"학습자들에게 구주와 그분의 복음에 대해 배우고 있는 것을 서로 이야기할 기회를 [준다]. 그럴 기회를 준다면 그들은 자신이 배운 진리들을 체화하고 표현할 수 있을 것이다. 또한 다른 환경에서도 진리를 나눌 수 있는 자신의 능력에 대해 자신감을 얻는 데 도움이 된다.","type":"paragraph","sourceId":true}],"revision":"238e19b724b7c5bc"},{"key":"/study/manual/teaching-in-the-saviors-way-2022/07-part-2/11-invite-diligent-learning","kind":"manual","url":"https://www.churchofjesuschrist.org/study/manual/teaching-in-the-saviors-way-2022/07-part-2/11-invite-diligent-learning","title":"Teaching in the Savior’s Way · Invite Diligent Learning","author":"","date":"2022","language":"en","coverage":"excerpt","edition":"Excerpt translated from the supplied Korean lesson; not verified official English","provenance":"Source: user-provided Pasted markdown.md; excerpt only. The supplied lesson links this quotation to p19. English retains the v2 prototype translation.","blocks":[{"id":"p19","markdown":"Give learners opportunities to talk with each other about what they are learning about the Savior and His gospel. These opportunities help them internalize and express the truths they have learned. They also help them gain confidence in their ability to share truth in other settings.","type":"paragraph","sourceId":true}],"revision":"33055287b0ca58bf"}]}</script>

function sectionName(id,l=lang(),lesson=currentLesson()){const s=lesson.sections.find(s=>s.id===id);return s?(s[l]||s.ko):tr('연결된 원문','Linked source');}
function typeLabel(t){return ({insight:tr('깨달음','Insight'),question:tr('질문','Question'),application:tr('실천','Application')})[t]||tr('깨달음','Insight');}
function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state));storageOK=true;$('#storageWarning').hidden=true;return true;}catch{storageOK=false;$('#storageWarning').textContent=tr('저장 공간에 기록할 수 없습니다. 새로고침 전에 내 기록을 JSON으로 내려받아 주세요.','Local storage is unavailable. Export your notes before reloading.');$('#storageWarning').hidden=false;return false;}}
function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.setAttribute('role',error?'alert':'status');el.innerHTML=icon(error?'info':'check')+`<span>${esc(message)}</span>`;$('#toastStack').append(el);setTimeout(()=>el.remove(),5500);}
function navEntries(){return [
 ['read','book',tr('이번 주 공부','This week’s study')],['community','chat',tr('반원들의 인사이트','Class insights')],['mine','note',tr('내 기록','My journal')],['classroom','screen',tr('주일학교 나눔','Sunday School')],['import','upload',tr('콘텐츠 넣기','Add content')]
];}
function sharedNotes(){return state.notes.filter(n=>n.scope==='class'&&n.anchor.lessonKey===lessonKey(currentLesson()));}
function ownNotes(){return state.notes.filter(n=>n.owner==='me');}
function eligible(n){return !!n&&n.scope==='class'&&n.consent===true;}
function queueNotes(){return state.queue.map(id=>state.notes.find(n=>n.id===id)).filter(n=>eligible(n)&&n.anchor.lessonKey===lessonKey(currentLesson()));}
function cleanQueue(){state.queue=state.queue.filter(id=>eligible(state.notes.find(n=>n.id===id)));}
function authorName(n){return n.owner==='me'?tr('나','Me'):(n.demo?tr(n.author,n.author.replace('반원 ','Member ')):n.author);}
function noteBody(n){return n.demo&&n.bodyI18n?.[lang()]?n.bodyI18n[lang()]:n.body;}
function noteQuote(n){return n.demo&&n.quoteI18n?.[lang()]?n.quoteI18n[lang()]:n.anchor.quote;}
function avatar(n){const c=n.owner==='me'?'':n.owner.endsWith('a')?'a':n.owner.endsWith('b')?'b':'c';const name=n.owner==='me'?tr('나','Me'):n.author.slice(-1);return `<span class="avatar ${c}">${esc(name)}</span>`;}
function sidebarHTML(){const entries=navEntries();return `<aside id="sidebar" class="sidebar" aria-label="${tr('주 탐색','Main navigation')}"><button class="sidebar-close" data-action="menu-close" aria-label="${tr('메뉴 닫기','Close menu')}">${icon('close')}</button><div class="brand"><span class="brand-mark">${icon('book','large')}</span><div><strong>${tr('함께','Together')}</strong><small>STUDY · INSIGHTS</small></div></div><div class="nav-label">${tr('배우고, 기록하고, 나누다','LEARN. REFLECT. SHARE.')}</div><nav class="nav-list">${entries.slice(0,4).map(([v,i,t])=>`<button class="nav-btn ${state.view===v?'active':''}" data-nav="${v}" ${state.view===v?'aria-current="page"':''}>${icon(i)}<span>${t}</span>${v==='community'?`<span class="count">${sharedNotes().length}</span>`:v==='mine'?`<span class="count">${ownNotes().length}</span>`:''}</button>`).join('')}</nav><div class="nav-label" style="margin-top:29px">${tr('학습 공간 설정','YOUR STUDY SPACE')}</div><nav class="nav-list">${entries.slice(4).map(([v,i,t])=>`<button class="nav-btn ${state.view===v?'active':''}" data-nav="${v}">${icon(i)}<span>${t}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="week-mini"><div class="eyebrow">COME, FOLLOW ME · 2026</div><strong>${esc(currentLesson().title[lang()]||currentLesson().title.ko)}</strong><small>${esc(currentLesson().date[lang()]||currentLesson().date.ko)}</small><div class="bar"><span id="readingProgress"></span></div><small id="progressText">${tr('내 속도로, 한 문장씩','At your pace, one passage at a time')}</small></div><div class="sidebar-note">${tr('비공식 인터랙티브 프로토타입<br>이 브라우저에서만 저장됩니다.','Unofficial interactive prototype<br>Saved in this browser only.')}</div></div></aside><div id="menuBackdrop" class="menu-backdrop" data-action="menu-close"></div>`;}
function topbarHTML(){return `<header class="topbar"><button class="mobile-menu" data-action="menu-open" aria-label="${tr('메뉴 열기','Open menu')}">${icon('menu')}</button><div class="crumb"><span class="desktop-crumb">${tr('우리 반 학습 공간','Our class study space')}</span><span class="desktop-crumb">/</span><b>${navEntries().find(n=>n[0]===state.view)?.[2]||''}</b></div><div class="top-actions"><div class="demo-badge"><span class="status-dot"></span>${tr('로컬 데모 · 실제 전송 없음','LOCAL DEMO · NOT SYNCED')}</div><div class="language-toggle" role="group" aria-label="${tr('콘텐츠 언어','Content language')}"><button data-lang="ko" class="${lang()==='ko'?'active':''}" aria-pressed="${lang()==='ko'}">한국어</button><button data-lang="en" class="${lang()==='en'?'active':''}" aria-pressed="${lang()==='en'}">EN</button></div><button class="avatar" data-action="about" aria-label="${tr('데모 안내','About this demo')}">${tr('나','Me')}</button></div></header>`;}
function mobileNavHTML(){return `<nav class="mobile-bottom" aria-label="${tr('빠른 탐색','Quick navigation')}">${navEntries().slice(0,4).map(([v,i,t])=>`<button data-nav="${v}" class="${state.view===v?'active':''}">${icon(i)}<span>${({dashboard:tr('공과','Lessons'),read:tr('공부','Study'),community:tr('함께 나눔','Insights'),mine:tr('내 기록','Journal'),classroom:tr('주일학교','Class')})[v]}</span></button>`).join('')}</nav>`;}
function render(){
 observer?.disconnect();document.documentElement.lang=lang()==='ko'?'ko':'en';document.documentElement.style.setProperty('--reader-size',`${state.fontSize}px`);
 const view=({dashboard:()=>typeof dashboardHTML==='function'?dashboardHTML():readHTML(),prompts:()=>window.TogetherPrompts?.html()||'',calendar:()=>window.TogetherCalendar?.html()||'',read:readHTML,community:communityHTML,mine:mineHTML,classroom:classroomHTML,import:importHTML,library:()=>typeof libraryHTML==='function'?libraryHTML():readHTML()})[state.view]||readHTML;
 $('#app').innerHTML=sidebarHTML()+`<div class="page">${topbarHTML()}${view()}</div>`+mobileNavHTML();
 $('#floatingInsight').hidden=state.view!=='read';$('#floatingHint').hidden=state.view!=='read';
 $('#floatingInsight').innerHTML=icon('spark')+`<span>${tr('인사이트','Insight')}</span>`;
 $('#floatingHint').textContent=tr('문장을 선택하거나, 지금 읽는 곳에 기록하세요.','Select a passage, or reflect on where you are reading.');
 if(state.view==='read'){applyHighlights();setupReadingObserver();requestAnimationFrame(updateProgress);}
 if(state.view==='import'){bindFileInputs();}
 if(!storageOK){$('#storageWarning').hidden=false;$('#storageWarning').textContent=tr('로컬 저장을 사용할 수 없습니다. 기록 후 JSON 내보내기를 이용해 주세요.','Local storage is unavailable. Please export your notes.');}
}
function pageIntro(title,sub,action=''){return `<div class="page-intro"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;}
function sourceHTML(block){
 const raw=textBlock(block);let body=markdown(raw);
 if(block.kind==='media'){let media=raw.trim();if(media.startsWith('(')&&media.endsWith(')'))media=media.slice(1,-1).trim();body=`<div class="media-link">${icon('image')}${inline(media)}${icon('book','small')}</div>`;}
 let ref=block.kind==='text'&&/^\[\*\*/.test(raw);
 let related=sharedNotes().filter(n=>n.anchor.segments?.some(s=>s.blockId===block.id)).length;
 return `<section class="passage kind-${block.kind}${ref?' reference':''}" data-block="${block.id}" data-section="${block.sectionId}" id="block-${block.id}"><div class="source-text snapshot-piece">${body}</div><div class="anchor-tools ${related?'has-notes':''}" data-no-capture="true">${related?`<button class="comment-counter" data-action="block-notes" data-block="${block.id}" aria-label="${tr('이 문단의 인사이트','Insights on this paragraph')} ${related}">${related}</button>`:`<button data-action="block-insight" data-block="${block.id}" aria-label="${tr('이 문단에 인사이트 남기기','Add an insight to this paragraph')}">${icon('plus','small')}</button>`}</div></section>`;
}
function readHTML(){
 const l=currentLesson();let content='';
 if(l.id===BASE.id){
  const date=plain(l.blocks.find(b=>b.id==='b02')[lang()]);const pos=date.indexOf(':');
  const title=pos>=0?date.slice(pos+1).trim():date;const dateOnly=pos>=0?date.slice(0,pos+1)+' ':'';
  content=`<div class="lesson-head"><div class="eyebrow snapshot-piece">${tr('와서 나를 따르라 · 가정 및 교회','COME, FOLLOW ME · HOME AND CHURCH')}</div><section class="passage" data-block="b02" data-section="intro" id="block-b02"><div class="source-text lesson-title snapshot-piece"><span class="lesson-date">${esc(dateOnly)}</span>${esc(title)}</div></section><section class="passage" data-block="b03" data-section="intro" id="block-b03"><div class="source-text lesson-scriptures snapshot-piece">${inline(textBlock(l.blocks.find(b=>b.id==='b03')).replace(/^#\s*/,''))}</div></section><details class="lesson-source"><summary>${tr('공과 그림 · 저작자 · 원본 링크','Lesson artwork · credits · source links')}</summary>${l.blocks.filter(b=>['b00','b01'].includes(b.id)).map(sourceHTML).join('')}</details><div class="reader-origin">${icon('link','small')} ${tr('첨부하신 한국어 원문을 수록했습니다. 미디어는 원본 링크로 열립니다.','The supplied Korean lesson is preserved. Media opens via original links.')}</div></div>`;
  content+=l.blocks.filter(b=>!['b00','b01','b02','b03'].includes(b.id)).map(sourceHTML).join('');
 }else{content=`<div class="lesson-head"><div class="eyebrow">${esc(l.date[lang()]||l.date.ko)}</div><h1 class="lesson-title">${esc(l.title[lang()]||l.title.ko)}</h1></div>`+l.blocks.map(sourceHTML).join('');}
 const notice=lang()==='en'?`<div class="translation-notice">${icon('globe','small')} ${l.translationStatus==='prototype-translation-from-user-korean-not-official'?'<strong>Prototype translation.</strong> Translated from the supplied Korean text; not the official English edition.':'<strong>User-provided English.</strong> Paragraph pairing was manually confirmed by the importer; official-edition status is not verified.'} <a href="${esc(l.sourceUrl.en)}" target="_blank" rel="noopener noreferrer">Open English source</a>.</div>`:'';
 return `<main class="workspace reading"><div class="main-column">${pageIntro(tr('이번 주, 함께 공부해요.','A little study. A shared insight.'),tr('말씀을 읽으며 떠오르는 생각을 그 자리에 남겨 보세요.','Keep the thoughts that come to you, right where you find them.'),`<button class="text-btn" data-action="demo-select">${tr('문장 선택 체험','Try selecting a passage')}${icon('arrow','small')}</button>`)}<div class="reader-tools"><select id="toc" aria-label="${tr('공과 목차','Lesson contents')}"><option value="">${tr('공과 목차','Lesson contents')}</option>${l.sections.map(s=>`<option value="${s.id}">${esc(s[lang()]||s.ko)}</option>`).join('')}</select><div class="tool-group"><span class="pill">${icon('book','small')}${tr('읽기 모드','Reading mode')}</span><div class="font-tools"><button data-action="font-smaller" aria-label="${tr('글자 작게','Smaller text')}">A−</button><button data-action="font-larger" aria-label="${tr('글자 크게','Larger text')}">A+</button></div></div></div>${notice}<article id="readerCard" class="reader-card" aria-label="${tr('공과 원문','Lesson text')}">${content}<footer class="reader-end"><span>${tr('오늘 마음에 남은 한 문장은 무엇인가요?','Which passage will stay with you today?')}</span><div class="reader-footer-actions"><button class="btn sm" data-action="about">${tr('자료 출처와 안내','Content information')}${icon('info')}</button><button class="btn sm primary" data-action="insight">${icon('spark')}${tr('기록하기','Reflect')}</button></div></footer></article></div><aside class="right-rail" id="rightRail" aria-label="${tr('공유 인사이트','Shared insights')}">${railHTML()}</aside></main>`;
}
function railHTML(){
 const notes=sharedNotes().filter(n=>n.anchor.sectionId===currentSection);const shown=notes.length?notes.slice(0,2):[];
 return `<div class="rail-title"><h2>${tr('함께 발견한 인사이트','What we’re discovering')}</h2><span class="count">${sharedNotes().length}</span></div><p class="rail-subtitle">${tr('예시 반원 · 실제 회원의 기록이 아닙니다.','Sample members · not real member records.')}</p><div class="rail-context">${icon('book','small')}<span>${esc(sectionName(currentSection))}</span></div>${shown.length?shown.map(n=>noteCard(n,{compact:true})).join(''):`<div class="empty-state" style="padding:25px 18px">${icon('spark')}<h3 style="font-size:14px">${tr('첫 생각을 나눠 주세요.','Share the first thought.')}</h3><p>${tr('이 부분에는 아직 공유된 기록이 없어요.','No shared insights here yet.')}</p><button class="btn sm" data-action="insight">${tr('인사이트 남기기','Add an insight')}</button></div>`}<button class="text-btn" data-nav="community">${tr('모든 인사이트 보기','See all insights')}${icon('arrow','small')}</button><div class="rail-tip">${icon('spark')}<strong>${tr('생각이 머무는 그 자리에','Right where a thought finds you')}</strong><p>${tr('문장을 드래그한 뒤 인사이트를 눌러 보세요. 인용문과 원문 위치가 함께 기록됩니다.','Select a passage, then tap Insight. The quotation and its location stay with your reflection.')}</p><button class="text-btn" data-action="demo-select">${tr('한 번 체험해 보기','Try it once')}${icon('arrow','small')}</button></div><span class="rail-footer">${icon('lock','small')} ${tr('기록은 기본적으로 나만 볼 수 있어요.<br>반원 공유와 주일학교 나눔은 직접 선택합니다.','New reflections are private by default.<br>Sharing and classroom display are your choice.')}</span>`;
}
function noteCard(n,{compact=false,mine=false}={}){
 const liked=n.likes.includes('me'),queued=state.queue.includes(n.id),sourceLabel=sectionName(n.anchor.sectionId,lang(),lessonForAnchor(n.anchor)||currentLesson());
 return `<article class="note-card${compact?' compact':''}" data-note="${esc(n.id)}"><div class="note-head">${avatar(n)}<div><strong>${esc(authorName(n))}</strong><small>${n.demo?tr('예시 기록', 'Sample reflection'):tr('내가 남긴 기록','My reflection')} · ${n.scope==='private'?tr('나만 보기','Private'):tr('반원 공유','Shared')}</small></div><span class="note-type ${n.type}">${typeLabel(n.type)}</span></div><blockquote class="note-quote ${compact?'clamp':''}">${esc(noteQuote(n))}</blockquote>${!n.demo&&n.language!==lang()?`<div class="xlang-note">${tr('작성 언어 그대로 표시됩니다. 자동 번역하지 않습니다.','Shown in its original language; not automatically translated.')}</div>`:''}<p class="note-body ${compact?'clamp':''}">${esc(noteBody(n))}</p><div class="note-actions">${n.scope==='class'?`${window.TogetherDiscussion.actionsHTML({id:n.id,liked,likes:n.likes.length,comments:n.comments.length})}`:`<span>${icon('lock','small')} ${tr('비공개','Private')}</span>`}<button class="source-action" data-action="source" data-id="${n.id}">${tr('원문으로','Go to passage')} ${icon('arrow')}</button></div>${!compact?`<div class="note-tail"><span>${esc(sourceLabel)}</span>${eligible(n)?`<span class="class-ready">${icon('screen','small')}${tr('나눔 허용','May be presented')}</span>`:''}</div>${mine?`<div class="actions-row" style="margin-top:13px"><button class="btn sm" data-action="edit-note" data-id="${n.id}">${icon('edit')}${tr('수정','Edit')}</button><button class="btn sm danger" data-action="delete-note" data-id="${n.id}">${icon('trash')}${tr('삭제','Delete')}</button></div>`:state.role==='teacher'&&eligible(n)?`<div class="actions-row" style="margin-top:13px"><button class="btn sm ${queued?'':'quiet'}" data-action="queue-toggle" data-id="${n.id}">${icon(queued?'check':'pin')}${queued?tr('나눔에 담김','Added to class'):tr('나눔에 담기','Add to class')}</button></div>`:''}`:''}</article>`;
}
function communityHTML(){
 const l=currentLesson();return `<main class="workspace"><div class="stream-wrap">${pageIntro(tr('함께 나누면, 더 깊어집니다.','Learning grows when we share.'),tr('같은 말씀에서 발견한 서로 다른 깨달음을 만나 보세요.','Discover what others are noticing in the same lesson.'))}<div class="stream-banner"><div><span class="eyebrow">THIS WEEK’S CONVERSATION</span><strong>${esc(l.title[lang()]||l.title.ko)}</strong><p>${tr('공개 인터넷 게시판이 아닌, 초대받은 반원들의 공간을 위한 설계입니다.','Designed as an invited class space, not a public internet forum.')}</p></div><button class="btn" data-nav="read">${icon('book')}${tr('공과 읽으러 가기','Return to reading')}</button></div><div class="demo-strip">${icon('info','small')}<span>${tr('화면 체험용 데이터입니다. 실제 회원 간 공유·로그인은 연결되지 않았습니다.','Demo data only. Member accounts and real sharing are not connected.')}</span><select id="demoRole" aria-label="${tr('데모 역할','Demo role')}"><option value="member" ${state.role==='member'?'selected':''}>${tr('성도 보기','Member view')}</option><option value="teacher" ${state.role==='teacher'?'selected':''}>${tr('교사 보기','Teacher view')}</option></select></div><div class="filters"><label class="search-field">${icon('search')}<input id="feedSearch" type="search" value="${esc(state.filters.query)}" placeholder="${tr('인용문이나 인사이트 검색','Search quotations or reflections')}" aria-label="${tr('인사이트 검색','Search insights')}"></label><select id="filterType" aria-label="${tr('기록 종류','Reflection type')}">${['all','insight','question','application'].map(x=>`<option value="${x}" ${state.filters.type===x?'selected':''}>${x==='all'?tr('모든 종류','All types'):typeLabel(x)}</option>`).join('')}</select><select id="filterLang" aria-label="${tr('작성 언어','Original language')}">${[['all',tr('모든 언어','All languages')],['ko','한국어'],['en','English']].map(([v,t])=>`<option value="${v}" ${state.filters.lang===v?'selected':''}>${t}</option>`).join('')}</select><select id="filterSection" aria-label="${tr('공과 주제','Lesson section')}"><option value="all">${tr('모든 부분','All sections')}</option>${l.sections.map(s=>`<option value="${s.id}" ${state.filters.section===s.id?'selected':''}>${esc(s[lang()]||s.ko)}</option>`).join('')}</select></div><div id="feedResults">${feedResultsHTML()}</div><p class="notice-foot">${tr('비공개 기록은 이 피드에 나타나지 않습니다. 화면의 A·B·C 반원과 댓글은 모두 사용법을 보여 주는 예시입니다.','Private reflections do not appear in this feed. Members A, B, C and their replies are illustrative examples.')}</p></div></main>`;
}
function feedResultsHTML(){
 const f=state.filters;let notes=sharedNotes().filter(n=>(f.type==='all'||n.type===f.type)&&(f.lang==='all'||n.language===f.lang)&&(f.section==='all'||n.anchor.sectionId===f.section)&&(!f.query||[n.body,n.anchor.quote,noteBody(n),noteQuote(n)].join(' ').toLowerCase().includes(f.query.toLowerCase()))).sort((a,b)=>b.created.localeCompare(a.created));
 return `<div class="section-row"><h2>${tr('이번 주 인사이트','This week’s insights')} <span class="muted">${notes.length}</span></h2><small>${tr('최근 기록부터','Newest first')}</small></div>${notes.length?`<div class="stream-grid">${notes.map(n=>noteCard(n)).join('')}</div>`:emptyHTML(tr('아직 해당하는 기록이 없어요.','No matching reflections yet.'),tr('다른 검색어나 필터를 사용해 보세요.','Try a different search or filter.'))}`;

<script>/* Content setup, import/export, universal in-app link routing. No network fetches. */
'use strict';
let libraryFilter='all',libraryQuery='',registerPreview=null,registerPrefill=null;
const renderBeforeLibrary=render,navBeforeLibrary=navEntries,previewBeforeAudit=previewImport;
navEntries=function(){const a=navBeforeLibrary();return [...a,["library","link",E('참조자료 관리','Reference library')]];};
function internalizeLinks(root=document){
 for(const a of $$('a[href]',root)){
  if(a.hasAttribute('download')||a.dataset.explicitExternal==='true')continue;
  const raw=a.dataset.refUrl||a.getAttribute('href');if(!raw||raw.startsWith('blob:')||raw.startsWith('data:'))continue;
  if(!a.dataset.refUrl&&!/^https?:|^\/study\//.test(raw))continue;
  const u=RE.cleanURL(raw);if(!u)continue;a.dataset.refUrl=u.href;a.setAttribute('href','#reference');a.removeAttribute('target');a.title=E('이 화면 옆에서 읽기','Read in the side panel');
 }
}
function auditLinks(raw,base){
 const rawLinks=RE.extractLinks(raw,base),map=new Map();
 for(const r of rawLinks){
  const language=r.language||lang();const expanded=r.kind==='scripture'&&r.chapters.length>1?r.chapters.map(ch=>({...r,key:r.key.split('/').slice(0,2).join('/')+'/'+ch,sourceURL:referenceURL(r.key.split('/').slice(0,2).join('/')+'/'+ch,[],language),chapter:ch,chapters:[ch],label:refBookName(r.key,language)+' '+ch,targets:{ids:[],ranges:[],invalid:false},verses:[]})):[r];
  for(const link of expanded){
   const id=link.key;if(!map.has(id))map.set(id,{key:id,kind:link.kind,parsed:link,labels:[],links:[],count:0});
   const item=map.get(id);item.count++;item.links.push({...link,language});if(!item.labels.includes(link.label))item.labels.push(link.label);
  }
 }
 return [...map.values()].map(item=>{const statuses={};for(const language of ['ko','en']){const b=recordFor(item.key,language);const matches=item.links.filter(l=>l.language===language);let missing=[];if(b)for(const r of matches){const result=RE.resolveTargets(r.targets,Object.values(b.rows));missing.push(...result.missing);if(result.invalid)missing.push('invalid-selector');}statuses[language]={coverage:b?.coverage||'missing',missing:[...new Set(missing)],title:b?.title||item.labels[0],registered:!!b};}return {...item,statuses};});
}
function currentAudit(){const l=currentLesson();return auditLinks([l.raw?.ko||l.blocks.map(b=>b.ko).join('\n\n'),l.raw?.en||l.blocks.map(b=>b.en||'').join('\n\n')].join('\n\n'),l.sourceUrl[lang()]);}
function languageStatus(s,label){return `<span class="audit-lang"><b>${label}</b><span class="ref-status ${s.coverage}">${coverageName(s.coverage)}${s.missing.length?' · '+E('일부 위치 미확인','positions missing'):''}</span></span>`;}
function auditTable(items,{compact=false}={}){
 if(!items.length)return `<div class="empty-state"><h3>${E('참조 링크가 없습니다.','No reference links.')}</h3><p>${E('Markdown 링크를 넣으면 이곳에 나타납니다.','Add Markdown links to see them here.')}</p></div>`;
 return `<div class="audit-list">${items.map(r=>`<article class="audit-row" data-audit-key="${esc(r.key)}"><div class="audit-type-icon">${icon(r.kind==='image'?'image':r.kind==='pdf'?'note':r.kind==='conference'?'chat':'book')}</div><div class="audit-main"><div class="audit-kicker">${typeName(r.kind)} · ${r.count} ${E('회 참조','links')}</div><strong>${esc(r.statuses[lang()].title)}</strong><small>${esc(r.key)}</small><div class="audit-languages">${languageStatus(r.statuses.ko,'KO')}${languageStatus(r.statuses.en,'EN')}</div></div><div class="audit-actions"><button class="btn sm" data-v3="open-reference" data-url="${esc(r.parsed.sourceURL)}" data-label="${esc(r.labels[0])}">${icon('split','small')}${E('읽기','Read')}</button><button class="text-btn" data-v3="register-url" data-url="${esc(r.parsed.sourceURL)}" data-label="${esc(r.statuses[lang()].title)}">${E('본문 넣기','Add text')}</button></div></article>`).join('')}</div>`;

function libraryHTML(){
 const all=currentAudit();const items=all.filter(r=>(libraryFilter==='all'||(libraryFilter==='attention'?['ko','en'].some(l=>r.statuses[l].coverage==='missing'||r.statuses[l].missing.length):r.kind===libraryFilter))&&(!libraryQuery||[r.key,...r.labels,r.statuses.ko.title,r.statuses.en.title].join(' ').toLowerCase().includes(libraryQuery.toLowerCase())));
 const stats={full:all.filter(r=>r.statuses[lang()].coverage==='full').length,excerpt:all.filter(r=>r.statuses[lang()].coverage==='excerpt').length,summary:all.filter(r=>r.statuses[lang()].coverage==='summary').length,missing:all.filter(r=>r.statuses[lang()].coverage==='missing').length};
 return `<main class="workspace library-workspace"><div class="library-intro">${pageIntro(E('링크는 자동으로. 읽기는 한곳에서.','Linked automatically. Read together.'),E('공과에 있는 주소를 분석하고, 등록된 본문과 연결합니다.','Lesson links are matched with text in your reference library.'),`<button class="btn primary" data-v3="register-new">${icon('plus')}${E('참조 본문 등록','Register reference')}</button>`)}</div><div class="library-summary"><div><span>${E('이 공과의 참조자료','Lesson references')}</span><strong>${all.length}</strong></div><div><span>${E('전문','Full text')}</span><strong>${stats.full}</strong></div><div><span>${E('발췌','Excerpts')}</span><strong>${stats.excerpt}</strong></div><div><span>${E('학습 요약','Summaries')}</span><strong>${stats.summary}</strong></div><div><span>${E('본문 필요','Needs text')}</span><strong>${stats.missing}</strong></div></div><div class="library-steps"><span>01 ${E('공과의 링크 추출','Extract links')}</span>${icon('chevron','small')}<span>02 ${E('주소·언어·위치 확인','Identify source and position')}</span>${icon('chevron','small')}<span>03 ${E('등록 본문 연결','Match registered text')}</span>${icon('chevron','small')}<span>04 ${E('옆에서 읽기','Read in the panel')}</span></div><div class="library-notice">${icon('info')}<div><strong>${E('자동 연결 ≠ 외부 본문 자동 수집','Automatic linking ≠ automatic downloading')}</strong><p>${E('연차대회 4편은 시연용 요약입니다. 사용할 수 있는 전문을 등록하면 같은 링크가 해당 본문을 엽니다. 부족한 본문과 위치는 숨기지 않습니다.','Four talks use labeled demo summaries. Register permitted full text to have the same links open it. Missing text and positions remain visible.')}</p></div></div><div class="library-toolbar"><div class="library-tabs">${[['all',E('전체','All')],['conference',E('연차대회','Talks')],['scripture',E('성구','Scriptures')],['manual',E('교재','Manuals')],['attention',E('준비 필요','Needs attention')]].map(([v,t])=>`<button data-v3="library-filter" data-filter="${v}" class="${libraryFilter===v?'active':''}">${t}</button>`).join('')}</div><label class="library-search">${icon('search','small')}<input id="librarySearch" value="${esc(libraryQuery)}" placeholder="${E('자료 검색','Search references')}" aria-label="${E('참조자료 검색','Search references')}"></label></div><div id="libraryResults">${auditTable(items)}</div><section class="content-pack-panel"><div><h2>${E('다른 기기에도 같은 본문을 보여 주려면','Make the same content available on every device')}</h2><p>${E('이 화면에서 넣은 본문은 현재 브라우저에만 저장됩니다. 콘텐츠 팩을 내보내 ZIP 안의 content/deployment-content.json을 교체한 뒤 GitHub에 올리세요. Vercel이 빌드할 때 포함합니다.','Browser imports are local. Export a content pack, replace content/deployment-content.json in your repository, and push to GitHub. The next build bundles it for every reader.')}</p><small>${E('콘텐츠 팩에는 개인 기록·댓글·캡처·형광펜이 포함되지 않습니다.','Content packs exclude personal notes, replies, captures and highlights.')}</small></div><div class="buttons"><button class="btn" data-v3="export-content">${icon('download')}${E('콘텐츠 팩 내보내기','Export content pack')}</button><label class="btn file-button">${icon('upload')}${E('팩 불러오기','Import pack')}<input id="contentPackFile" type="file" accept=".json,application/json" hidden></label></div></section></main>`;
}
function addReaderLaunch(){

function parseReferenceText(text,format='markdown'){
 if(typeof text!=='string'||text.length>600000)throw Error(E('600,000자 이하의 본문을 넣어 주세요.','Limit the input to 600,000 characters.'));
 let chunks=[];
 if(format==='html'){
  const doc=new DOMParser().parseFromString(text,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,form,input,button,svg,link,meta,base,template,noscript,img,video,audio,source').forEach(el=>el.remove());
  function toText(node){if(node.nodeType===Node.TEXT_NODE)return node.textContent;if(node.nodeType!==Node.ELEMENT_NODE)return '';if(node.tagName==='BR')return '\n';const inner=[...node.childNodes].map(toText).join('');if(node.tagName==='A'){const u=RE.cleanURL(node.getAttribute('href')||'', $('#refURL')?.value||RE.CHURCH);return u?'['+inner+']('+u.href+')':inner;}return inner;}
  const candidates=[...doc.body.querySelectorAll('h1,h2,h3,h4,p,li,blockquote,[data-aid][id]')].filter(el=>!el.querySelector('p,li,h1,h2,h3,h4,blockquote'));
  chunks=(candidates.length?candidates:[doc.body]).map(el=>({id:el.id||null,text:toText(el).trim(),type:/^H[1-4]$/.test(el.tagName)?'heading':'paragraph'})).filter(b=>b.text);
 }else{
  chunks=text.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(raw=>{
   let id=null;let value=raw.trim();const marker=value.match(/^(?:<!--\s*anchor:([A-Za-z][\w-]*)\s*-->|\{#([A-Za-z][\w-]*)\})\s*/);
   if(marker){id=marker[1]||marker[2];value=value.slice(marker[0].length);}
   const type=/^#{1,6}\s/.test(value)?'heading':'paragraph';value=value.replace(/^#{1,6}\s/,'');return {id,text:value.trim(),type};
  }).filter(b=>b.text);
 }
 const ids=new Set();return chunks.map((b,i)=>{const id=b.id||'local-'+RE.fingerprint(b.text).slice(0,10)+'-'+(i+1);if(ids.has(id))throw Error(E('문단 ID가 중복됩니다: ','Duplicate paragraph ID: ')+id);ids.add(id);return {id,markdown:b.text,type:b.type,sourceId:!!b.id};});
}

   const fromScope=`visitor/${visitor()}`,toScope=`user/${newUserId}`,fromStart=`${prefix}${encode(fromScope)}:`,toStart=`${prefix}${encode(toScope)}:`,store=storage();
   for(const oldKey of keysFor(fromScope)){
    let raw=null,oldValue=null;try{raw=store?.getItem(oldKey);oldValue=parse(raw);}catch{}if(!oldValue)continue;
    const suffix=oldKey.slice(fromStart.length),newKey=toStart+suffix,newValue=stored(newKey);
    try{if(!newValue||oldValue.updatedAt>newValue.updatedAt)store.setItem(newKey,raw);store.removeItem(oldKey);knownKeys.delete(oldKey);knownKeys.add(newKey);}
    catch{if(newValue&&newValue.updatedAt>=oldValue.updatedAt)continue;
     const separator=suffix.indexOf(':');if(separator<1)continue;
     try{const kind=decodeURIComponent(suffix.slice(0,separator)),target=decodeURIComponent(suffix.slice(separator+1)),data={body:oldValue.body};if(typeof oldValue.name==='string')data.name=oldValue.name;const current=pending.get(newKey);if(!current||current.updatedAt<oldValue.updatedAt){if(current?.timer)timers.clear(current.timer);pending.set(newKey,{key:newKey,kind,target,data,updatedAt:oldValue.updatedAt,timer:null,sourceKey:oldKey});knownKeys.add(newKey);}}catch{}
    }
   }
   for(const [oldKey,entry]of [...pending])if(oldKey.startsWith(fromStart)){
    const newKey=toStart+oldKey.slice(fromStart.length),current=pending.get(newKey);
    pending.delete(oldKey);knownKeys.delete(oldKey);
    if(current&&current.updatedAt>=entry.updatedAt)continue;
    if(current?.timer)timers.clear(current.timer);
    entry.key=newKey;entry.timer=null;entry.sourceKey=current?.sourceKey||oldKey;pending.set(newKey,entry);knownKeys.add(newKey);
   }
   states.clear();for(const entry of pending.values())if(entry.key.startsWith(toStart)&&!entry.timer)emit(entry.kind,entry.target,'error',entry.updatedAt);
  }
  function identityEvent(event){
   const value=event?.detail||{};if(!Object.prototype.hasOwnProperty.call(value,'previousUserId'))return;
   const next=value.newUserId||value.userId||null,signature=`${value.previousUserId||''}>${next||''}:${value.adoptingGuest===true}`;
   if(signature===lastTransition)return;lastTransition=signature;
   if(value.adoptingGuest&&!value.previousUserId)migrateGuest(next);else{flush();states.clear();}
  }
  env.addEventListener?.('pagehide',()=>flush());
  doc?.addEventListener?.('visibilitychange',()=>{if(doc.hidden)flush();});
  doc?.addEventListener?.('together:before-identity',identityEvent);
  doc?.addEventListener?.('together:identity',identityEvent);
  return {read,save,flush,clear,status};
 };

 function projectId(env){
  const raw=env.TogetherCloud?.client?.supabaseUrl;
  try{if(raw)return new URL(raw).host.toLowerCase();}catch{}
  try{return `local@${env.location?.origin||'unknown'}`;}catch{return 'local@unknown';}
 }

<script>/* Staff lesson authoring: source -> extracted details -> reviewed public revision. */
'use strict';
(function(){

 const allowed=()=>window.TogetherAccess?.can('content')===true;
 const fresh=()=>({ko:'',en:'',titleKO:'',titleEN:'',date:'',url:'',id:null,editing:false,expectedVersion:null,analyzed:'',alignment:false,rights:false});

 const reviewKey=d=>JSON.stringify([d.ko,d.en,d.titleKO,d.titleEN,d.date,d.url,d.id,d.expectedVersion]);
 function session(){
  if(!draft||actor!==userId()){
   actor=userId();draft=fresh();parsed=null;reviewed=null;error='';notice='';
   if(actor)try{const saved=JSON.parse(window.TogetherDrafts?.read('lesson-import','editor')?.body||'null');if(saved&&typeof saved==='object'){
    for(const key of ['ko','en','titleKO','titleEN','date','url'])if(typeof saved[key]==='string')draft[key]=saved[key].slice(0,key==='ko'||key==='en'?400000:key==='url'?4096:160);
    if(typeof saved.id==='string'&&/^[-\w]{1,100}$/.test(saved.id))draft.id=saved.id;
    if(typeof saved.expectedVersion==='string'&&/^[-\w]{1,100}$/.test(saved.expectedVersion))draft.expectedVersion=saved.expectedVersion;

    notice=E('작성 중이던 공과를 복원했습니다. 게시 전 미리보기를 다시 확인하세요.','Your unfinished lesson was restored. Preview it again before publishing.');
   }}catch{}
  }

 }
 function persist(){if(actor&&draft)window.TogetherDrafts?.save('lesson-import','editor',{body:JSON.stringify({...draft,alignment:false,rights:false})});}
 function field(id,label,type='text',max=160){return `<label class="field"><span>${label}</span><input id="${id}" type="${type}" maxlength="${max}" value="${esc(draft[fields[id]])}" placeholder="${E('본문 분석 후 확인하거나 직접 입력','Review extracted details or enter manually')}"></label>`;}
 function html(){

  <fieldset class="import-form" ${busy?'disabled':''}>

  <section class="panel" id="importSourceSection"><h2>${E('1. 원문 넣고 분석하기','1. Add and analyze the text')}</h2><p class="help">${E('웹페이지에서 본문을 복사해 붙여 넣으면 제목·문단·링크를 유지합니다. Markdown이나 텍스트 파일도 사용할 수 있습니다. 본문을 분석하면 공과 기본 정보를 채웁니다.','Copy and paste the text from a webpage to keep its headings, paragraphs and links. Markdown and text files also work. Analyze the text to fill the lesson details.')}</p><p class="help" id="importPasteStatus" role="status"></p>

  <div class="fields-two">${field('importTitleKO',E('한국어 제목','Korean title'))}${field('importTitleEN',E('영어 제목 (선택)','English title (optional)'))}</div><div class="fields-two">${field('importDate',E('공과 기간','Lesson date'), 'text',100)}${field('importURL',E('공과 원문 URL','Lesson source URL'),'url',4096)}</div><p class="help">${E('원문 주소가 본문에 없다면 직접 입력하세요. 참조 성구나 이미지 주소는 공과 원문 주소로 사용하지 않습니다.','Enter the lesson URL if it is absent from the text. Scripture and image references are not treated as the lesson URL.')}</p></section>

  <label class="checkline"><input id="importAlignment" type="checkbox" ${d.alignment?'checked':''}><span>${E('공과 기본 정보와 본문을 확인했습니다. 두 언어를 넣었다면 문단별 내용과 순서도 확인했습니다.','I reviewed the details and text, including paragraph order and meaning when both languages are present.')}</span></label><label class="checkline"><input id="importRights" type="checkbox" ${d.rights?'checked':''}><span>${E('이 자료를 사이트 방문자에게 공개할 수 있는지 확인했습니다.','I have confirmed this material can be shared with site visitors.')}</span></label>
  <p class="help">${E('게시하면 모든 방문자의 주별 공과에 표시됩니다. 수정본을 게시해도 이전 공과 버전과 그 기록은 보존됩니다.','Publishing adds the lesson to everyone’s weekly dashboard. Earlier revisions and their reflections remain available.')}</p><div id="importError" class="alert error" role="alert" ${error?'':'hidden'}>${esc(error)}</div><button class="btn primary" data-import="publish" ${busy||!reviewed?'disabled':''}>${icon('upload')}${busy?E('게시 중…','Publishing…'):d.expectedVersion?E('수정 내용 게시','Publish changes'):E('공과 게시','Publish lesson')}</button><p class="help" id="importDraftStatus" role="status">${E('작성 중인 내용은 이 기기에 임시 저장됩니다. 게시 전에는 공개되지 않습니다.','Unfinished work is saved on this device. It remains private until you publish.')}</p></section></fieldset></div></main>`;
 }
 function invalidate(){reviewed=null;draft.alignment=false;draft.rights=false;error='';for(const id of ['importAlignment','importRights'])if($('#'+id))$('#'+id).checked=false;if($('#importPreview'))$('#importPreview').innerHTML='';if($('[data-import="publish"]'))$('[data-import="publish"]').disabled=true;if($('#importError'))$('#importError').hidden=true;}
 function paint(){if(state.view==='import')refreshPreservingScroll();}
 function fail(message){error=message;const target=$('#importError');if(target){target.textContent=message;target.hidden=false;target.scrollIntoView({block:'nearest'});}else toast(message,true);}
 function getBlocks(){const d=session();if(!d.ko.trim())throw Error(E('한국어 원문을 입력해 주세요.','Enter the Korean text.'));const ko=parseImportBlocks(d.ko),en=d.en.trim()?parseImportBlocks(d.en):{blocks:[],sections:[]};if(!ko.blocks.length)throw Error(E('읽을 수 있는 문단이 없습니다.','No readable paragraphs found.'));return {ko,en};}
 function analyze(){if(!allowed()||busy)return;const d=session();try{
  parsed=getBlocks();const key=contentKey(d),same=d.analyzed===key;let warnings=[];
  if(!same){const m=window.TogetherImportModel.extractMetadata({ko:d.ko,en:d.en});warnings=m.warnings||[];Object.assign(d,{titleKO:m.title.ko,titleEN:m.title.en,date:m.date,url:m.sourceUrl});d.analyzed=key;}
  const missing=[[d.titleKO,E('한국어 제목','Korean title')],[d.date,E('기간','dates')],[d.url,E('원문 URL','source URL')]].filter(([v])=>!v).map(([,label])=>label);
  notice=missing.length?E(`본문을 분석했습니다. ${missing.join(' · ')}은 직접 입력해 주세요.`,`Text analyzed. Please enter: ${missing.join(', ')}.`):E('기본 정보를 채웠습니다. 게시 전에 내용을 확인해 주세요.','Details are filled in. Review them before publishing.');
  if(warnings.some(w=>['invalid-date','ambiguous-date'].includes(w)))notice+=' '+E('날짜가 올바른지 확인해 주세요.','Please verify the dates.');
  const linkCounts=['ko','en'].filter(l=>d[l].trim()).map(l=>({label:l==='ko'?'한국어':'English',count:ReferenceEngine.extractLinks(d[l]).length}));
  notice+=' '+E('본문 링크: ','Links in the text: ')+linkCounts.map(l=>`${l.label} ${l.count}`).join(' · ')+'.';
  if(linkCounts.some(l=>!l.count))notice+=' '+E('링크가 0개인 본문은 웹 원문에서 다시 복사하거나 Markdown 링크를 넣어 주세요. 주소가 없는 일반 텍스트에서는 링크를 복원할 수 없습니다.','For text with no links, copy it again from the webpage or add Markdown links. Plain text without addresses cannot restore the original links.');
  invalidate();persist();paint();$('#importDetailsSection')?.scrollIntoView({block:'start',behavior:'smooth'});
 }catch(e){fail(e.message);}}
 function canonical(value){try{const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password)return '';return u.origin+u.pathname.replace(/\/$/,'');}catch{return '';}}
 async function digest(value){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value)))].map(x=>x.toString(16).padStart(2,'0')).join('');}
 async function review(){if(!allowed()||busy)return;const d=session(),who=actor;try{
  if(d.analyzed!==contentKey(d))throw Error(E('본문이 바뀌었습니다. 1번의 본문 분석을 먼저 눌러 주세요.','Analyze the current text in step 1 first.'));
  const blocks=getBlocks(),before=reviewKey(d);parsed=blocks;if(blocks.en.blocks.length&&blocks.en.blocks.length!==blocks.ko.blocks.length)throw Error(E('두 언어의 문단 수가 다릅니다. 순서를 맞추거나 영어를 비워 주세요.','Paragraph counts differ. Align the two texts or leave English blank.'));

  reviewed={key,lesson};error='';persist();paint();$('#importPreview')?.scrollIntoView({block:'start',behavior:'smooth'});
 }catch(e){fail(e.message);}}
 function previewHTML(l){return `<article class="import-reading-preview"><div class="eyebrow">${E('방문자에게 표시될 내용','VISITOR PREVIEW')}</div><h2>${esc(l.title.ko)}</h2><p>${esc(l.date.ko)}</p><a href="${esc(l.sourceUrl.ko)}" target="_blank" rel="noopener noreferrer">${E('공과 원문 열기','Open original lesson')}${icon('external','small')}</a><p class="help">${l.blocks.length} ${E('문단 · 아래에서 전체 내용을 확인하세요.','paragraphs · review the complete text below.')}</p><div class="import-paragraphs">${l.blocks.map((b,i)=>`<section class="import-pair"><small>${i+1}</small><div>${markdown(b.ko)}</div>${l.raw.en?`<div lang="en">${markdown(b.en)}</div>`:''}</section>`).join('')}</div></article>`;}
 async function publish(){if(!allowed()||busy)return;const d=session(),who=actor,packet=reviewed;
  if(!packet||packet.key!==reviewKey(d)){fail(E('현재 내용으로 미리보기를 다시 확인해 주세요.','Preview the current content before publishing.'));return;}
  if(!d.alignment||!d.rights){fail(E('본문 검토와 공개 확인을 모두 선택해 주세요.','Confirm both the content review and permission to publish.'));return;}
  busy=true;error='';paint();try{
   const lesson=await window.TogetherPublishing.publish(packet.lesson,{expectedVersion:d.expectedVersion});
   if(userId()!==who||draft!==d)return;
   window.TogetherDrafts?.clear('lesson-import','editor');draft=fresh();parsed=null;reviewed=null;notice='';state.activeLesson=lessonKey(lesson);currentSection='intro';saveState();navigate('dashboard');toast(E('공과를 게시했습니다. 모든 방문자가 볼 수 있습니다.','Lesson published. It is visible to every visitor.'));
  }catch(e){if(userId()===who&&draft===d){error=['40001','PT409'].includes(e.code)||/conflict|changed|stale/i.test(e.message||'')?E('다른 담당자가 이 공과를 수정했습니다. 입력 내용은 유지했습니다. 최신 공과를 불러와 변경 사항을 확인해 주세요.','Another editor updated this lesson. Your work is kept. Load the latest lesson and review the changes.'):e.code==='invalid_lesson_size'?E('공과 분량이 게시 한도(2.5 MB)를 넘습니다. 본문을 나누거나 불필요한 내용을 줄여 주세요.','This lesson exceeds the 2.5 MB publishing limit. Split the material or remove unnecessary text.'):e.code==='42501'?E('게시 권한을 확인해 주세요. 관리자 또는 콘텐츠 담당자만 게시할 수 있습니다.','Only an administrator or content editor can publish.'):E('게시 결과를 확인하지 못했습니다. 입력 내용은 유지했습니다. 연결을 확인한 뒤 다시 게시해 주세요.','Publication could not be confirmed. Your work is kept. Check your connection and try publishing again.');}}
  finally{busy=false;paint();}
 }
 function loadSelected(){if(busy||!allowed())return;const selected=$('#importLessonPicker')?.value,l=lessons().find(x=>lessonKey(x)===selected);if(!l)return;draft={...fresh(),ko:l.raw.ko,en:l.raw.en,titleKO:l.title.ko,titleEN:l.title.en,date:l.date.ko,url:l.sourceUrl.ko,id:l.id,editing:true,expectedVersion:window.TogetherPublishing?.getLatest(l.id)?.version||null};draft.analyzed=contentKey(draft);parsed=null;reviewed=null;error='';notice=E('공과를 불러왔습니다. 수정한 뒤 미리보기를 확인하고 게시하세요.','Lesson loaded. Edit, preview and publish your changes.');persist();paint();}
 function bind(){
  for(const [id,key]of [['fileKO','ko'],['fileEN','en']])$('#'+id)?.addEventListener('change',async e=>{const f=e.target.files[0],d=session(),who=actor,token=++fileRead;if(!f)return;if(f.size>400000){fail(E('400 KB 이하의 Markdown 또는 텍스트 파일을 선택해 주세요.','Choose a Markdown or text file under 400 KB.'));return;}try{const text=await f.text();if(d!==draft||who!==userId()||token!==fileRead)return;d[key]=text;if(!d.editing){d.id=null;d.expectedVersion=null;}invalidate();persist();paint();}catch{fail(E('파일을 읽지 못했습니다.','Could not read the file.'));}});
 }
 document.addEventListener('paste',event=>{
  const target=event.target;if(!['importKO','importEN'].includes(target.id)||state.view!=='import'||busy||!allowed()||!event.clipboardData)return;

   const html=event.clipboardData.getData('text/html'),text=event.clipboardData.getData('text/plain');if(!html)return;
   const sourceURL=html.match(/^SourceURL:([^\r\n]+)/m)?.[1]||'';

<script>/* Public study questions.  Reading and replies are public; only staff can author prompts. */
'use strict';
(()=>{

 const dateLabel=value=>{try{return new Intl.DateTimeFormat(lang()==='ko'?'ko-KR':'en-US',{year:'numeric',month:'short',day:'numeric'}).format(new Date(value));}catch{return '';}};

 const DRAFT_KIND='prompt-reply';const savedReplyDrafts=new Map();

 function applyReplyDraft(){const target=replyTarget(),name=$('#promptReplyName'),body=$('#promptReplyBody');if(!target||!name||!body)return;name.value=P.replyDraft.name;body.value=P.replyDraft.body;const count=$('#promptReplyCount');if(count)count.textContent=`${P.replyDraft.body.length} / ${LIMITS.reply}`;}

 function scheduleReplyDraft(){const target=replyTarget(),snapshot={name:P.replyDraft.name,body:P.replyDraft.body,nameEdited:P.replyDraft.nameEdited};if(target)window.TogetherDrafts?.save?.(DRAFT_KIND,target,snapshot);}

 };
 function routeFromLocation(){const m=location.pathname.match(/^\/p\/([a-f0-9]{12})\/?$/i);return m?m[1].toLowerCase():null;}

 function promptHTML(){

 }
 function cardHTML(row){return `<article class="prompt-card"><button class="prompt-card-main" data-prompt-open="${esc(row.slug)}"><div class="prompt-card-meta"><span>${esc(row.reference_label||T('함께 읽기','Study together'))}</span><time datetime="${esc(row.created_at||'')}">${esc(dateLabel(row.created_at))}</time></div><h2>${esc(row.title)}</h2><p>${esc(row.question)}</p></button><div class="prompt-card-footer"><span>${icon('chat','small')}${row.reply_count} ${T('개의 생각','responses')}</span><button class="text-btn" data-prompt-open="${esc(row.slug)}">${T('질문 보기','Open question')}${icon('arrow','small')}</button></div></article>`;}
 function posterSlot(row,previewUrl=''){if(previewUrl)return `<img class="prompt-poster" src="${esc(previewUrl)}" alt="${esc(row.title)} · ${T('첨부한 질문 포스터','attached question poster')}">`;return row.poster_path?`<div class="prompt-poster-slot" data-prompt-poster="${esc(row.poster_path)}" data-prompt-poster-alt="${esc(row.title+' · '+row.author+' · '+T('질문 포스터','question poster'))}"><span>${T('질문 포스터를 불러오는 중…','Loading question poster…')}</span></div>`:'';}
 function detailHTML(row){const external=row.source_url?`<a class="prompt-original-link" data-explicit-external="true" href="${esc(row.source_url)}" target="_blank" rel="noopener noreferrer">${icon('external','small')}<span>${T('공식 원문 열기','Open original source')}</span><small>${T('새 탭','New tab')}</small></a>`:'';const anchor=row.anchor&&typeof row.anchor==='object'?`<button class="text-btn" data-prompt-action="anchor">${icon('book','small')}${T('공과의 이 위치로 이동','Open this place in the lesson')}</button>`:'';queueMicrotask(afterRender);return `<main class="workspace prompts-workspace prompt-detail"><div class="prompt-back"><button class="text-btn" data-prompt-action="back">${icon('back','small')}${T('모든 질문','All questions')}</button><span><button class="text-btn" data-prompt-action="share">${icon('link','small')}${T('공유 링크','Share link')}</button>${canAuthor()&&(own(row)||window.TogetherAccess?.role==='admin')?`<button class="text-btn" data-prompt-action="edit">${icon('edit','small')}${T('수정','Edit')}</button><button class="text-btn danger" data-prompt-action="delete">${icon('trash','small')}${T('삭제','Delete')}</button>`:''}</span></div><article class="prompt-reading"><div class="prompt-card-meta"><span>${esc(row.reference_label||T('함께 읽기','Study together'))}</span><time datetime="${esc(row.created_at||'')}">${esc(dateLabel(row.created_at))}</time></div><h1>${esc(row.title)}</h1>${posterSlot(row)}<div class="prompt-question">${esc(row.question)}</div>${row.reading_text?`<section class="prompt-material"><h2>${T('읽기 자료','Reading material')}</h2><p>${esc(row.reading_text)}</p></section>`:''}${external}${anchor}</article><section class="prompt-responses" aria-live="polite"><div class="prompt-responses-heading"><div><span class="eyebrow">${T('함께 나눈 생각','SHARED THOUGHTS')}</span><h2>${T('짧은 생각을 나누어 보세요','Share a short thought')}</h2></div><span class="count">${P.replies.length}</span></div>${replyFormHTML()}<div id="promptReplies">${repliesHTML()}</div></section></main>`;}
 function replyFormHTML(){prefillReplyName();const d=P.replyDraft,target=replyTarget(),status=P.replyDraftStatus;return `<form id="promptReplyForm" class="prompt-reply-form"><label>${T('이름 또는 별명 (선택)','Name or nickname (optional)')}<input id="promptReplyName" maxlength="${LIMITS.author}" autocomplete="nickname" value="${esc(d.name)}" placeholder="${T('익명','Anonymous')}"></label><label>${T('생각','Your thought')}<textarea id="promptReplyBody" maxlength="${LIMITS.reply}" required placeholder="${T('질문이나 읽기 자료에서 마음에 남은 점을 적어 보세요.','Share what stayed with you from the question or reading material.')}"${P.replySubmission?' aria-busy="true"':''}>${esc(d.body)}</textarea></label><div class="prompt-form-foot"><span id="promptReplyCount">${d.body.length} / ${LIMITS.reply}</span><span data-prompt-draft-status data-prompt-draft-target="${esc(target)}" data-status="${esc(status)}" class="prompt-draft-status">${draftStatusText(status)}</span><span id="promptReplyError" class="alert error" ${P.replyError?'':'hidden'} role="alert">${esc(P.replyError)}</span><button class="btn primary" type="submit" data-prompt-submit ${P.replySubmission?'disabled':''}>${T('생각 나누기','Share thought')}</button></div></form>`;}
 function discussionActions(row){return window.TogetherDiscussion.actionsHTML({id:row.id,target:'prompt',liked:row.discussionLiked,likes:row.discussionLikes||0,comments:row.discussionComments||0,busy:row.discussionBusy});}
 function repliesHTML(){if(P.replyLoading&&!P.replies.length)return `<div class="prompt-loading">${T('생각을 불러오는 중…','Loading responses…')}</div>`;if(!P.replies.length)return `<div class="empty-state prompt-replies-empty">${icon('chat')}<h3>${T('첫 생각을 나누어 보세요.','Share the first thought.')}</h3><p>${T('로그인 없이 이름을 비워 두고 나눌 수 있습니다.','You can respond without signing in and leave your name blank.')}</p></div>`;return P.replies.map(reply=>`<article class="prompt-reply" data-prompt-reply="${esc(reply.id)}"><div><strong>${esc(reply.author||T('익명','Anonymous'))}</strong><time datetime="${esc(reply.created_at||'')}">${esc(dateLabel(reply.created_at))}</time>${reply.owner_id===window.TogetherCloud?.user?.id?`<button class="text-btn prompt-reply-delete" data-prompt-reply-delete="${esc(reply.id)}">${T('삭제','Delete')}</button>`:''}</div><p>${esc(reply.body)}</p><div class="note-actions" data-discussion-controls="${esc(reply.id)}">${discussionActions(reply)}</div></article>`).join('');}
 function emptyHTML(){return `<div class="empty-state prompts-empty">${icon('spark')}<h2>${T('아직 열린 질문이 없습니다.','There are no study questions yet.')}</h2><p>${canAuthor()?T('새 질문을 만들어 반원과 함께 읽기 자료를 나누어 보세요.','Create a question to share reading material with your class.'):T('교사가 질문을 올리면 이곳에서 읽고 생각을 나눌 수 있습니다.','When a teacher posts a question, you can read it and share a thought here.')}</p>${canAuthor()?`<button class="btn primary" data-prompt-action="new">${icon('plus')}${T('새 질문','New question')}</button>`:''}</div>`;}

 function rerender(force=false){if(state.view!=='prompts')return;const active=document.activeElement;if(!force&&active?.closest?.('#promptReplyForm,.prompt-editor-form'))return;render();}
 function revokePosters(){for(const entry of posterURLs.values())if(entry.url)URL.revokeObjectURL(entry.url);posterURLs.clear();}

 }}
 async function list(){const c=client();if(!c)return [];const rows=[];for(let offset=0;;offset+=200){const {data,error}=await c.from('together_prompts').select('*,together_prompt_replies(count)').order('created_at',{ascending:false}).order('id').range(offset,offset+199);if(error)throw error;rows.push(...(data||[]));if((data||[]).length<200)break;}return rows.map(normalize);}
 async function loadReplies(id,generation=P.routeGeneration){if(!id||!client())return [];P.replyLoading=true;const holder=$('#promptReplies');if(holder)holder.innerHTML=repliesHTML();try{const rows=[];for(let offset=0;;offset+=200){const {data,error}=await client().from('together_prompt_replies').select('id,prompt_id,owner_id,author,body,created_at,together_prompt_reply_comments(count),together_prompt_reply_reactions(count)').eq('prompt_id',id).order('created_at',{ascending:true}).order('id').range(offset,offset+199);if(error)throw error;rows.push(...(data||[]));if((data||[]).length<200)break;}const actor=window.TogetherCloud?.user?.id,liked=new Set();if(actor)for(let offset=0;offset<rows.length;offset+=200){const result=await client().from('together_prompt_reply_reactions').select('reply_id').eq('owner_id',actor).in('reply_id',rows.slice(offset,offset+200).map(r=>r.id));if(result.error)throw result.error;for(const reaction of result.data)liked.add(reaction.reply_id);}for(const row of rows){row.discussionLikes=Number(row.together_prompt_reply_reactions?.[0]?.count||0);row.discussionComments=Number(row.together_prompt_reply_comments?.[0]?.count||0);row.discussionLiked=liked.has(row.id);}if(generation===P.routeGeneration&&P.current?.id===id)P.replies=rows;return rows;}catch(error){if(generation===P.routeGeneration)P.replies=[];throw error;}finally{if(generation===P.routeGeneration){P.replyLoading=false;const el=$('#promptReplies');if(el)el.innerHTML=repliesHTML();}}}
